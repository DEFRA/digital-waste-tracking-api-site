site_name: Digital Waste Tracking API
site_url: https://defra.github.io/digital-waste-tracking-api-site/
repo_url: https://github.com/DEFRA/digital-waste-tracking-api-site
remote_branch: gh-pages
theme:
  name: material
  custom_dir: tech_docs_template
  logo: logos/defra.png
  favicon: favicons/defra.ico
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.share
    #- content.action.edit
    - content.action.view
    - toc.integrate
    # uncomment to merge TOC with navigation bar
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    admonition:
      quote: octicons/quote-16
  palette:
    scheme: default
nav:
  - Digital Waste Tracking:
      - About: index.md
      - Integration guidance: software-provider-integration-guidance.md
      - API spec (beta-2): api/openapi-beta-2.md
      - API spec (beta-1): api/openapi-beta-1.md
      - Problem types: problems/index.md
edit_uri: edit/main/docs/
plugins:
  - material/search
  - swagger-ui-tag
  #- git-revision-date-localized
#      type: custom
#     custom_format: "%d %B %Y"
#- document-dates:
#   type: date
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.magiclink
  - tables
  - attr_list
  - toc:
      toc_depth: 1
extra:
  version:
    provider: mike
    default: production
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:wasteuserresearch@defra.gov.uk
      name: 'Contact us here'
    - icon: fontawesome/brands/github
      link: https://github.com/defra/waste-tracking-service
      name: 'Our DWT service is available here'
#  analytics:
#    provider: google

#    property: G-SKK1DY4NVV

