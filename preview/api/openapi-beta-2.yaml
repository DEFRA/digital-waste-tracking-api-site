  /deliveries/{deliveryId}/receipt:
    parameters:
      - name: deliveryId
        in: path
        required: true
        description: Delivery ID returned by `POST /deliveries`.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Delivery ID
          description: 'Unique identifier for a delivery, returned by `POST /deliveries`. The server mints a new ID for the non-hazardous Delivery; a hazardous Movement''s Delivery reuses its Movement ID. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
          type: string
          pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
          examples:
            - 25KMT4Z9
        example: 25KMT4Z9
    post:
      tags:
        - Receipt
      summary: Record receipt of waste against a delivery
      description: Records receipt of the waste delivered under the given delivery.
      operationId: recordReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Record receipt request
              description: Payload for POST /beta-2/deliveries/{deliveryId}/receipt.
              type: object
              properties:
                receiptDateTime:
                  description: When the waste was received at the receiver's site.
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Receipt date-time
                  examples:
                    - '2026-10-14T09:30:00Z'
                  type: string
                  format: date-time
                carrier:
                  description: The carrier that delivered the waste.
                  $schema: https://json-schema.org/draft/2020-12/schema
