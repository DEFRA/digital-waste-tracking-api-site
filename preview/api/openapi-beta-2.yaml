          examples:
            - Handle with care and keep upright.
          type: string
          minLength: 1
          maxLength: 500
        consignmentNote:
          description: The hazardous waste consignment note. Required when any waste item declares hazardous properties. Replaces hazardousWasteConsignmentCode and reasonForNoConsignmentCode.
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Consignment note
          examples:
            - code: CJTILE/A0001
            - reasonForNoCode: Carrier did not provide a consignment note
          type: object
          allOf:
            - if:
                properties:
                  code:
                    type: string
                    minLength: 1
                required:
                  - code
              then:
                properties:
                  reasonForNoCode:
                    not:
                      type: string
                      minLength: 1
                    description: Not allowed when 'code' is provided
          properties:
            code:
              type:
                - string
