                          description: Not allowed unless 'isPresent' is true
                    properties:
                      isPresent:
                        type: boolean
                        description: Whether the waste item has any hazardous properties.
                      codes:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          enum:
                            - HP_1
                            - HP_2
                            - HP_3
                            - HP_4
                            - HP_5
                            - HP_6
                            - HP_7
                            - HP_8
                            - HP_9
                            - HP_10
                            - HP_11
                            - HP_12
                            - HP_13
                            - HP_14
                            - HP_15
                            - HP_POP
                          description: 'A hazardous property code: HP_1 to HP_15, or HP_POP.'
                        description: The hazardous property codes that apply to the waste item. At least one is required when isPresent is true; not allowed otherwise. Duplicates are accepted.
                    required:
                      - isPresent
                    additionalProperties: false
                required:
                  - wasteDescription
                  - ewcCodes
                  - pops
                  - hazardous
                additionalProperties: false
              physicalDetails:
