                pattern: ^\s*(?:(?:[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Aa][Ww][Mm][Ll]\d{5,6})|(?:[Ww][Mm][Ll]\d{5,6})|(?:[Pp][Pp][Cc]\/[AaWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7}\/\d{2})|(?:[Pp][Pp][Cc]\/[Aa]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ww][Mm][Ll]\/[Ll]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ee][Aa][Ss]\/[Pp]\/\d{6})|(?:[Pp]\d{4}\/\d{2}[A-Za-z])|(?:[Pp]\d{4}\/\d{2}[A-Za-z]\/[Vv]\d+)|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2})|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2}\/[Vv]\d+)|(?:[Ww][Mm][Ll] \d{2}\/\d+(\/[Tt])? [Ll][Nn]\/\d{2}\/\d+(\/([MmTtCcNn]|[Vv]\d+))*)|(?:[Ww][Mm][Ll] \d{2}\/\d+ [Pp][Aa][Cc]\/\d{4}\/[Ww][Cc][Ll]\d{3}))\s*$
              receiptAddress:
                description: Address the waste will be received at. postcode is required; fullAddress is optional.
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Address
                examples:
                  - fullAddress: 10 Industrial Way, Test City
                    postcode: TE1 2PQ
                type: object
                properties:
                  fullAddress:
                    type: string
                    minLength: 1
                    description: Full address line.
                  postcode:
                    type: string
                    pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                    description: Accepts UK postcodes and Irish Eircodes.
                required:
                  - postcode
                additionalProperties: false
              contactDetails:
                description: How to contact the receiving site. At least one of emailAddress or phoneNumber is required.
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Contact details
                examples:
                  - emailAddress: producer@example.com
                    phoneNumber: '01234567890'
                  - emailAddress: producer@example.com
                type: object
                properties:
                  emailAddress:
                    type: string
                    format: email
                    description: Contact email address.
                  phoneNumber:
                    type: string
                    pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                    description: Contact phone number, in a valid format.
                anyOf:
                  - properties:
                      emailAddress: {}
                    required:
                      - emailAddress
                  - properties:
                      phoneNumber: {}
                    required:
                      - phoneNumber
                additionalProperties: false
            required:
              - siteName
              - authorisationNumber
              - receiptAddress
              - contactDetails
            additionalProperties: false
          minItems: 1
          description: The intended receivers of the waste. At least one is required.
        wasteItems:
          type: array
          items:
            type: object
            properties:
              classification:
                description: 'What the waste item is: its description, EWC codes, POPs and hazardous properties.'
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Waste item classification
                examples:
                  - wasteDescription: Mixed municipal waste
                    ewcCodes:
                      - '200301'
                    pops:
                      isPresent: false
                    hazardous:
                      isPresent: false
                  - wasteDescription: Fluorescent tubes
                    ewcCodes:
                      - '200121'
                    pops:
                      isPresent: true
                      sourceOfComponents: GUIDANCE
                      components:
                        - code: PFOS
                          concentrationThresholdOperator: LESS_THAN
                    hazardous:
                      isPresent: true
                      codes:
                        - HP_6
                        - HP_14
                type: object
                properties:
                  wasteDescription:
                    type: string
                    minLength: 1
                    description: A free-text description of the waste. An empty string is treated as not provided.
                  ewcCodes:
                    type: array
                    items:
                      type: string
                      pattern: ^\d{6}$
                      description: 'A European Waste Catalogue (EWC) code: six digits, with no spaces. Only the format is checked here; the service also checks the code is one of those served by GET /reference-data/ewc-codes, which is too long a list to inline, and reports an unrecognised code as an InvalidValue error.'
                    minItems: 1
                    maxItems: 5
                    description: 'The EWC codes that describe the waste: at least one, and up to five to allow for dual and mirror codes. Each must be six digits and a code from GET /reference-data/ewc-codes; the service checks the second.'
                  pops:
                    description: Whether the waste item contains persistent organic pollutants, and if so which. Required, even when there are none.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Persistent organic pollutants
                    examples:
                      - isPresent: false
                      - isPresent: true
                        sourceOfComponents: OWN_TESTING
                        components:
                          - code: PFOA
                            concentration: 0.5
                          - code: PFOS
                            concentrationThresholdOperator: LESS_THAN
                    type: object
                    if:
                      properties:
                        isPresent:
                          const: true
                      required:
                        - isPresent
                    then:
                      properties:
                        sourceOfComponents: {}
                        components: {}
                      required:
                        - sourceOfComponents
                        - components
                      description: Required when 'isPresent' is true
                    else:
                      properties:
                        sourceOfComponents:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                        components:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                    properties:
                      isPresent:
                        type: boolean
                        description: Whether the waste item contains any persistent organic pollutants.
                      sourceOfComponents:
                        type: string
                        enum:
                          - GUIDANCE
                          - PROVIDED_WITH_WASTE
                          - OWN_TESTING
                          - NOT_PROVIDED
                        description: 'Where the POP details came from: government guidance, provided with the waste, the receiver''s own testing or analysis, or not provided. Required when isPresent is true; not allowed otherwise.'
                      components:
                        type: array
                        minItems: 1
                        items:
                          $schema: https://json-schema.org/draft/2020-12/schema
                          title: POP component
                          description: 'A persistent organic pollutant (POP) in a waste item: its code, and either its concentration or how its concentration compares with the threshold WM3 sets for that code, but not both. A concentration of null or an empty string is treated as not provided.'
                          examples:
                            - code: PFOA
                              concentration: 0.5
                            - code: PFOS
                              concentrationThresholdOperator: LESS_THAN
                          type: object
                          allOf:
                            - if:
                                properties:
                                  concentration:
                                    type: number
                                required:
                                  - concentration
                              then:
                                properties:
                                  concentrationThresholdOperator:
                                    not: {}
                                    description: Not allowed when 'concentration' is provided
                              else:
                                properties:
                                  concentrationThresholdOperator: {}
                                required:
                                  - concentrationThresholdOperator
                                description: Required when 'concentration' is not provided
                          properties:
                            code:
                              type: string
                              minLength: 1
                              description: The POP's code, from GET /reference-data/pop-names. Only checked for being non-empty here; the service checks it against the reference data and reports an unrecognised code as an InvalidValue error.
                            concentration:
                              if:
                                type: number
                              then:
                                type: number
                                exclusiveMinimum: 0
                                description: Must be greater than 0
                              else:
                                enum:
                                  - null
                                  - ''
                                description: Must be a number greater than 0, or null or an empty string when not provided
                              description: 'The POP''s concentration: a number greater than 0. null or an empty string means not provided. Exactly one of ''concentration'' or ''concentrationThresholdOperator'' is required.'
                            concentrationThresholdOperator:
                              type: string
                              enum:
                                - LESS_THAN
                                - EQUAL_TO
                                - GREATER_THAN
                              description: How the POP's concentration compares with the threshold WM3 sets for its code, when the concentration itself isn't given. The threshold value isn't sent. Exactly one of 'concentration' or 'concentrationThresholdOperator' is required.
                          required:
                            - code
                          additionalProperties: false
                        description: The POPs the waste item contains. At least one is required when isPresent is true, whatever the source; not allowed otherwise.
                    required:
                      - isPresent
                    additionalProperties: false
                  hazardous:
                    description: Whether the waste item has hazardous properties, and if so which. Required, even when there are none. A movement is hazardous when any of its waste items declares hazardous properties.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Hazardous properties
                    examples:
                      - isPresent: true
                        codes:
