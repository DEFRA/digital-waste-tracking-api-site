              pattern: ^(?:|[A-Za-z0-9]{2,}/[A-Za-z0-9]{5}[A-Za-z]?|S[ABC]\d{7}|D[ABC]\d{7})$
              description: The consignment note code, in an EA / NRW (CJTILE/A0001), SEPA (SA1234567) or NIEA (DA1234567) format. Mirrors the hazardous waste consignment patterns from @defra/waste-movement-utils, as one pattern. Required when any waste item declares hazardous properties, unless 'reasonForNoCode' is provided; also accepted for non-hazardous waste.
            reasonForNoCode:
              type:
                - string
                - 'null'
              description: 'Free text: why there is no consignment note code. Required when any waste item declares hazardous properties and ''code'' is not provided; not allowed when ''code'' is provided.'
          additionalProperties: false
