                        minLength: 1
                        maxLength: 50
                        description: Reference value — must be supplied together with its label.
                      label:
                        type: string
                        enum:
                          - WEIGHBRIDGE_NUMBER
                          - PO_NUMBER
                          - JOB_NUMBER
                          - INVOICE_NUMBER
                          - WASTE_TICKET_NUMBER
                          - OTHER
                        description: Label identifying the reference type.
                    required:
                      - reference
                      - label
                    additionalProperties: false
              required:
                - movementIds
                - carrier
