                        minLength: 1
                        maxLength: 50
                        description: Reference value — must be supplied together with its label.
                      label:
                        type: string
                        enum:
                          - Weighbridge Number
                          - PO Number
                          - Job Number
                          - Invoice Number
                          - Waste Ticket Number
                          - Other
                        description: Label identifying the reference type.
                    required:
                      - reference
                      - label
                    additionalProperties: false
              required:
                - movementIds
                - carrier
              additionalProperties: false
            examples:
              twoMovements:
                summary: Two movements delivered together
                value:
                  movementIds:
                    - 25HRA0B2
                    - 25HRA0B3
                  carrier:
                    organisationName: Carrier Demo Ltd
