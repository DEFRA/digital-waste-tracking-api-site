          format: date-time
        carrier:
          description: The carrier that delivered the waste.
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Carrier
          examples:
            - organisationName: Carrier Demo Ltd
              registrationNumber: CBDU123456
              meansOfTransport: ROAD
              vehicleRegistration: AB12 CDE
              contactDetails:
                emailAddress: carrier@example.com
                phoneNumber: '01234567890'
              address:
                fullAddress: 4 Carrier Lane, Test City
                postcode: TE1 4CR
          type: object
          allOf:
            - if:
                properties:
                  registrationNumber: {}
                required:
                  - registrationNumber
              then:
                properties:
                  reasonForNoRegistrationNumber:
                    not: {}
                    description: Not allowed when 'registrationNumber' is provided
              else:
                properties:
                  reasonForNoRegistrationNumber: {}
                required:
                  - reasonForNoRegistrationNumber
                description: Required when 'registrationNumber' is not provided
            - if:
                properties:
                  meansOfTransport:
                    const: ROAD
                required:
                  - meansOfTransport
              then:
                properties:
                  vehicleRegistration: {}
                required:
                  - vehicleRegistration
                description: Required when 'meansOfTransport' is 'ROAD'
              else:
                properties:
                  vehicleRegistration:
                    not: {}
                    description: Not allowed unless 'meansOfTransport' is 'ROAD'
            - if:
                properties:
                  meansOfTransport:
                    const: OTHER
                required:
                  - meansOfTransport
              then:
                properties:
                  otherMeansOfTransport: {}
                required:
                  - otherMeansOfTransport
                description: Required when 'meansOfTransport' is 'OTHER'
              else:
                properties:
                  otherMeansOfTransport:
                    not: {}
                    description: Not allowed unless 'meansOfTransport' is 'OTHER'
          properties:
            organisationName:
              type: string
              minLength: 1
              description: Name of the carrier organisation.
            registrationNumber:
              description: Waste carrier registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Exactly one of 'registrationNumber' or 'reasonForNoRegistrationNumber' is required.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Registration number
              examples:
                - CBDU123456
              type: string
              pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
            reasonForNoRegistrationNumber:
              type: string
              enum:
                - ON_SITE
                - HOUSEHOLD
                - ONE_OFF
                - MARINE
              description: Why the carrier has no registration number. Exactly one of 'registrationNumber' or 'reasonForNoRegistrationNumber' is required.
            meansOfTransport:
              type: string
              enum:
                - ROAD
                - RAIL
                - AIR
                - SEA
                - INLAND_WATERWAY
                - PIPED
                - OTHER
              description: How the carrier will transport the waste.
            vehicleRegistration:
              type: string
              minLength: 1
              description: Registration of the vehicle carrying the waste. Required when meansOfTransport is ROAD; forbidden otherwise.
            otherMeansOfTransport:
              type: string
              minLength: 1
              description: Description of the means of transport. Required when meansOfTransport is OTHER; forbidden otherwise.
            contactDetails:
              description: How to contact the carrier.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Contact details
              examples:
                - emailAddress: producer@example.com
                  phoneNumber: '01234567890'
                - emailAddress: producer@example.com
              type: object
              properties:
                emailAddress:
                  type: string
                  format: email
                  description: Contact email address.
                phoneNumber:
                  type: string
                  pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                  description: Contact phone number, in a valid format.
              if:
                properties:
                  emailAddress: {}
                required:
                  - emailAddress
              else:
                properties:
                  phoneNumber: {}
                required:
                  - phoneNumber
                description: Required when 'emailAddress' is not provided
              additionalProperties: false
            address:
              description: The carrier's address.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Address
              examples:
                - fullAddress: 10 Industrial Way, Test City
                  postcode: TE1 2PQ
              type: object
              properties:
                fullAddress:
                  type: string
                  minLength: 1
                  description: Full address line.
                postcode:
                  type: string
                  pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                  description: Accepts UK postcodes and Irish Eircodes.
              required:
                - postcode
              additionalProperties: false
          required:
            - organisationName
            - meansOfTransport
            - contactDetails
          additionalProperties: false
        receiver:
          description: The receiver that received the waste.
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Receiver
          examples:
            - siteName: Receiver Site Ltd
              authorisationNumber: EAS/P/123456
              receiptAddress:
                fullAddress: 3 Receiver Road, Test City
                postcode: TE1 3RC
              contactDetails:
                emailAddress: receiver@example.com
                phoneNumber: '01234567890'
          type: object
          properties:
            siteName:
              type: string
              minLength: 1
              description: Name of the receiving site.
            authorisationNumber:
              description: Receiver environmental permit or exemption number, in a valid UK format.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Authorisation number
              examples:
                - EAS/P/123456
              type: string
              pattern: ^\s*(?:(?:[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Aa][Ww][Mm][Ll]\d{5,6})|(?:[Ww][Mm][Ll]\d{5,6})|(?:[Pp][Pp][Cc]\/[AaWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7}\/\d{2})|(?:[Pp][Pp][Cc]\/[Aa]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ww][Mm][Ll]\/[Ll]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ee][Aa][Ss]\/[Pp]\/\d{6})|(?:[Pp]\d{4}\/\d{2}[A-Za-z])|(?:[Pp]\d{4}\/\d{2}[A-Za-z]\/[Vv]\d+)|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2})|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2}\/[Vv]\d+)|(?:[Ww][Mm][Ll] \d{2}\/\d+(\/[Tt])? [Ll][Nn]\/\d{2}\/\d+(\/([MmTtCcNn]|[Vv]\d+))*)|(?:[Ww][Mm][Ll] \d{2}\/\d+ [Pp][Aa][Cc]\/\d{4}\/[Ww][Cc][Ll]\d{3}))\s*$
            receiptAddress:
              description: Address the waste will be received at. postcode is required; fullAddress is optional.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Address
              examples:
                - fullAddress: 10 Industrial Way, Test City
                  postcode: TE1 2PQ
              type: object
              properties:
                fullAddress:
                  type: string
                  minLength: 1
                  description: Full address line.
                postcode:
                  type: string
                  pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                  description: Accepts UK postcodes and Irish Eircodes.
              required:
                - postcode
              additionalProperties: false
            contactDetails:
              description: How to contact the receiving site. At least one of emailAddress or phoneNumber is required.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Contact details
              examples:
                - emailAddress: producer@example.com
                  phoneNumber: '01234567890'
                - emailAddress: producer@example.com
              type: object
              properties:
                emailAddress:
                  type: string
                  format: email
                  description: Contact email address.
                phoneNumber:
                  type: string
                  pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                  description: Contact phone number, in a valid format.
              if:
                properties:
                  emailAddress: {}
                required:
                  - emailAddress
              else:
                properties:
                  phoneNumber: {}
                required:
                  - phoneNumber
                description: Required when 'emailAddress' is not provided
              additionalProperties: false
          required:
            - siteName
            - authorisationNumber
            - receiptAddress
            - contactDetails
          additionalProperties: false
        wasteItems:
          description: The items of waste received. At least one is required, and every item needs at least one treatment.
          type: array
          items:
            type: object
            properties:
              classification:
                description: 'What the waste item is: its description, EWC codes, POPs and hazardous properties.'
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Waste item classification
                examples:
                  - wasteDescription: Mixed municipal waste
                    ewcCodes:
                      - '200301'
                    pops:
                      isPresent: false
                    hazardous:
                      isPresent: false
                  - wasteDescription: Fluorescent tubes
                    ewcCodes:
                      - '200121'
                    pops:
                      isPresent: true
                      componentsSource: GUIDANCE
                      components:
                        - code: PFOS
                          threshold: LESS_THAN
                    hazardous:
                      isPresent: true
                      codes:
                        - HP_6
                        - HP_14
                      componentsSource: PROVIDED_WITH_WASTE
                      isComponentsNotApplicable: false
                      components:
                        - name: Mercury
                          threshold: EQUAL_TO
                type: object
                properties:
                  wasteDescription:
                    type: string
                    minLength: 1
                    description: A free-text description of the waste. An empty string is treated as not provided.
                  ewcCodes:
                    type: array
                    items:
                      type: string
                      pattern: ^\d{6}$
                      description: 'A European Waste Catalogue (EWC) code: six digits, with no spaces. Only the format is checked here; the service also checks the code is one of those served by GET /reference-data/ewc-codes, which is too long a list to inline, and reports an unrecognised code as an InvalidValue error.'
                    minItems: 1
                    maxItems: 5
                    description: 'The EWC codes that describe the waste: at least one, and up to five to allow for dual and mirror codes. Each must be six digits and a code from GET /reference-data/ewc-codes; the service checks the second.'
                  pops:
                    description: Whether the waste item contains persistent organic pollutants, and if so which. Required, even when there are none.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Persistent organic pollutants
                    examples:
                      - isPresent: false
                      - isPresent: true
                        componentsSource: OWN_TESTING
                        components:
                          - code: PFOA
                            unit: MG_PER_KG
                            amount: 0.5
                          - code: PFOS
                            threshold: LESS_THAN
                    type: object
                    if:
                      properties:
                        isPresent:
                          const: true
                      required:
                        - isPresent
                    then:
                      properties:
                        componentsSource: {}
                        components: {}
                      required:
                        - componentsSource
                        - components
                      description: Required when 'isPresent' is true
                    else:
                      properties:
                        componentsSource:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                        components:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                    properties:
                      isPresent:
                        type: boolean
                        description: Whether the waste item contains any persistent organic pollutants.
                      componentsSource:
                        type: string
                        enum:
                          - GUIDANCE
                          - PROVIDED_WITH_WASTE
                          - OWN_TESTING
                        description: 'Where the POP details came from: government guidance, provided with the waste, or the receiver''s own testing or analysis. Required when isPresent is true; not allowed otherwise.'
                      components:
                        type: array
                        minItems: 1
                        items:
                          $schema: https://json-schema.org/draft/2020-12/schema
                          title: POP component
                          description: 'A persistent organic pollutant (POP) in a waste item: its code, and either its concentration as an amount with a unit or how its concentration compares with the threshold WM3 sets for that code, but not both.'
                          examples:
                            - code: PFOA
                              unit: MG_PER_KG
                              amount: 0.5
                            - code: PFOS
                              threshold: LESS_THAN
                          type: object
                          allOf:
                            - if:
                                properties:
                                  amount: {}
                                required:
                                  - amount
                              then:
                                properties:
                                  threshold:
                                    not: {}
                                    description: Not allowed when 'amount' is provided
                                  unit: {}
                                required:
                                  - unit
                                description: Required when 'amount' is provided
                              else:
                                properties:
                                  threshold: {}
                                required:
                                  - threshold
                                description: Required when 'amount' is not provided
                          properties:
                            code:
                              type: string
                              minLength: 1
                              description: The POP's code, from GET /reference-data/pop-names. Only checked for being non-empty here; the service checks it against the reference data and reports an unrecognised code as an InvalidValue error.
                            unit:
                              type: string
                              enum:
                                - MG_PER_KG
                              description: 'The unit of the amount: milligrams per kilogram. Required when ''amount'' is provided.'
                            amount:
                              type: number
                              exclusiveMinimum: 0
                              description: 'The POP''s concentration, in ''unit'': a number greater than 0. Exactly one of ''amount'' or ''threshold'' is required.'
                            threshold:
                              type: string
                              enum:
                                - LESS_THAN
                                - EQUAL_TO
                                - GREATER_THAN
                              description: How the POP's concentration compares with the threshold WM3 sets for its code, when the amount itself isn't given. The threshold value isn't sent. Exactly one of 'amount' or 'threshold' is required.
                          required:
                            - code
                          additionalProperties: false
                        description: The POPs the waste item contains. At least one is required when isPresent is true, whatever the source; not allowed otherwise.
                    required:
                      - isPresent
                    additionalProperties: false
                  hazardous:
                    description: Whether the waste item has hazardous properties, and if so which. Required, even when there are none. A movement is hazardous when any of its waste items declares hazardous properties.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Hazardous properties
                    examples:
                      - isPresent: true
                        codes:
                          - HP_4
                          - HP_8
                        componentsSource: OWN_TESTING
                        isComponentsNotApplicable: false
                        components:
                          - name: Mercury
                            unit: MG_PER_KG
                            amount: 120
                          - name: Lead compounds
                            threshold: GREATER_THAN
                      - isPresent: true
                        codes:
                          - HP_14
                        componentsSource: GUIDANCE
                        isComponentsNotApplicable: true
                      - isPresent: false
                    type: object
                    if:
                      properties:
                        isPresent:
                          const: true
                      required:
                        - isPresent
                    then:
                      properties:
                        codes: {}
                        componentsSource: {}
                        isComponentsNotApplicable: {}
                      required:
                        - codes
                        - componentsSource
                        - isComponentsNotApplicable
                      description: Required when 'isPresent' is true
                      allOf:
                        - if:
                            properties:
                              isComponentsNotApplicable:
                                const: false
                            required:
                              - isComponentsNotApplicable
                          then:
                            properties:
                              components: {}
                            required:
                              - components
                            description: Required when 'isComponentsNotApplicable' is false
                        - if:
                            properties:
                              isComponentsNotApplicable:
                                const: true
                            required:
                              - isComponentsNotApplicable
                          then:
                            properties:
                              components:
                                not: {}
                                description: Not allowed when 'isComponentsNotApplicable' is true
                    else:
                      properties:
                        codes:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                        componentsSource:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                        isComponentsNotApplicable:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                        components:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                    properties:
                      isPresent:
                        type: boolean
                        description: Whether the waste item has any hazardous properties.
                      codes:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          enum:
                            - HP_1
                            - HP_2
                            - HP_3
                            - HP_4
                            - HP_5
                            - HP_6
                            - HP_7
                            - HP_8
                            - HP_9
                            - HP_10
                            - HP_11
                            - HP_12
                            - HP_13
                            - HP_14
                            - HP_15
                            - HP_POP
                          description: 'A hazardous property code: HP_1 to HP_15, or HP_POP.'
                        description: The hazardous property codes that apply to the waste item. At least one is required when isPresent is true; not allowed otherwise. Duplicates are accepted.
                      componentsSource:
                        type: string
                        enum:
                          - GUIDANCE
                          - PROVIDED_WITH_WASTE
                          - OWN_TESTING
                        description: 'Where the hazardous component details came from: government guidance, provided with the waste, or the receiver''s own testing or analysis. Required when isPresent is true, including when isComponentsNotApplicable is true; not allowed otherwise.'
                      isComponentsNotApplicable:
                        type: boolean
                        description: Whether no hazardous components need reporting for the waste item. Required when isPresent is true; not allowed otherwise. When it is true, components are not allowed; when it is false, at least one component is required.
                      components:
                        type: array
                        minItems: 1
                        items:
                          $schema: https://json-schema.org/draft/2020-12/schema
                          title: Hazardous component
                          description: 'A hazardous component of a waste item: its name, and either its concentration as an amount with a unit or how its concentration compares with the relevant threshold, but not both.'
                          examples:
                            - name: Mercury
                              unit: MG_PER_KG
                              amount: 120
                            - name: Lead compounds
                              threshold: GREATER_THAN
                          type: object
                          allOf:
                            - if:
                                properties:
                                  amount: {}
                                required:
                                  - amount
                              then:
                                properties:
                                  threshold:
                                    not: {}
                                    description: Not allowed when 'amount' is provided
                                  unit: {}
                                required:
                                  - unit
                                description: Required when 'amount' is provided
                              else:
                                properties:
                                  threshold: {}
                                required:
                                  - threshold
                                description: Required when 'amount' is not provided
                          properties:
                            name:
                              type: string
                              minLength: 1
                              description: The hazardous component's name, as free text. Not checked against any reference data.
                            unit:
                              type: string
                              enum:
                                - MG_PER_KG
                              description: 'The unit of the amount: milligrams per kilogram. Required when ''amount'' is provided.'
                            amount:
                              type: number
                              exclusiveMinimum: 0
                              description: 'The component''s concentration, in ''unit'': a number greater than 0. Exactly one of ''amount'' or ''threshold'' is required.'
                            threshold:
                              type: string
                              enum:
                                - EQUAL_TO
                                - GREATER_THAN
                              description: 'How the component''s concentration compares with the relevant threshold, when the amount itself isn''t given: equal to it or greater than it. The threshold value isn''t sent. Exactly one of ''amount'' or ''threshold'' is required.'
                          required:
                            - name
                          additionalProperties: false
                        description: The hazardous components the waste item contains. At least one is required when isPresent is true and isComponentsNotApplicable is false; not allowed otherwise.
                    required:
                      - isPresent
                    additionalProperties: false
                required:
                  - wasteDescription
                  - ewcCodes
                  - pops
                  - hazardous
                additionalProperties: false
              physicalDetails:
                description: The physical form, containers and total weight of the waste item.
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Physical details
                examples:
                  - form: SOLID
                    containerType: DRU
                    containerCount: 4
                    totalWeight:
                      amount: 250.5
                      unit: KILOGRAMS
                      isEstimate: false
                type: object
                allOf:
                  - if:
                      properties:
                        containerType:
                          const: LOO
                      required:
                        - containerType
                    then:
                      properties:
                        containerCount:
                          const: 0
                          description: Must be 0 when 'containerType' is 'LOO'
                    else:
                      properties:
                        containerCount:
                          type: integer
                          minimum: 1
                          description: Must be at least 1 unless 'containerType' is 'LOO'
                properties:
                  form:
                    type: string
                    enum:
                      - GAS
                      - LIQUID
                      - SOLID
                      - POWDER
                      - SLUDGE
                      - MIXED
                    description: The physical form of the waste. Case-sensitive.
                  containerType:
                    type: string
                    enum:
                      - BAG
                      - BAL
                      - BOX
                      - CAN
                      - CAR
                      - CAS
                      - CON
                      - DRU
                      - FIB
                      - IBC
                      - LOO
                      - PAL
                      - ROR
                      - SKI
                      - TAN
                      - WBI
                    description: Code for how the waste is contained. LOO means the waste is loose, with no containers. Case-sensitive.
                  containerCount:
                    type: integer
                    minimum: 0
                    description: 'The number of containers: a whole number of 0 or more. Must be 0 when containerType is LOO, and at least 1 for any other container type.'
                  totalWeight:
                    description: The total weight of the waste item.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Weight
                    examples:
                      - amount: 250.5
                        unit: KILOGRAMS
                        isEstimate: false
                    type: object
                    properties:
                      amount:
                        type: number
                        exclusiveMinimum: 0
                        description: The weight, in the given unit. Must be greater than 0.
                      unit:
                        type: string
                        enum:
                          - GRAMS
                          - KILOGRAMS
                          - TONNES
                        description: The unit the amount is measured in. Case-sensitive.
                      isEstimate:
                        type: boolean
                        description: Whether the weight is estimated (true) or actual (false).
                    required:
                      - amount
                      - unit
                      - isEstimate
                    additionalProperties: false
                required:
                  - form
                  - containerType
                  - containerCount
                  - totalWeight
                additionalProperties: false
              treatments:
                description: 'Required on every waste item of a receipt: at least one disposal or recovery operation'
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Treatments
                examples:
                  - - disposalOrRecoveryCode: R3
                      weight:
                        amount: 250.5
                        unit: KILOGRAMS
                        isEstimate: false
                type: array
                minItems: 1
                items:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Treatment
                  description: A disposal or recovery operation applied to the waste, and the weight of waste it applies to. Both are required.
                  examples:
                    - disposalOrRecoveryCode: R3
                      weight:
                        amount: 250.5
                        unit: KILOGRAMS
                        isEstimate: false
                  type: object
                  properties:
                    disposalOrRecoveryCode:
                      type: string
                      enum:
                        - R1
                        - R2
                        - R3
                        - R4
                        - R5
                        - R6
                        - R7
                        - R8
                        - R9
                        - R10
                        - R11
                        - R12
                        - R13
                        - D1
                        - D2
                        - D3
                        - D4
                        - D5
                        - D6
                        - D7
                        - D8
                        - D9
                        - D10
                        - D11
                        - D12
                        - D13
                        - D14
                        - D15
                      description: The recovery (R1–R13) or disposal (D1–D15) operation code. Case-sensitive.
                    weight:
                      description: The weight of waste this treatment applies to.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Weight
                      examples:
                        - amount: 250.5
                          unit: KILOGRAMS
                          isEstimate: false
                      type: object
                      properties:
                        amount:
                          type: number
                          exclusiveMinimum: 0
                          description: The weight, in the given unit. Must be greater than 0.
                        unit:
                          type: string
                          enum:
                            - GRAMS
                            - KILOGRAMS
                            - TONNES
                          description: The unit the amount is measured in. Case-sensitive.
                        isEstimate:
                          type: boolean
