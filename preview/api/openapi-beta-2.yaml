  /deliveries:
    post:
      tags:
        - Delivery
      summary: Record a delivery
      description: Records a delivery event. All the non-hazardous Movements share one new Delivery ID; each hazardous Movement gets its own Delivery, whose Delivery ID is its Movement ID.
      operationId: recordDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Record delivery request
              description: Payload for POST /beta-2/deliveries.
              type: object
              properties:
                movementIds:
                  type: array
                  items:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Movement ID
                    description: 'Unique identifier for a waste movement, minted by the server on `POST /movements`. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
                    type: string
                    pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
                    examples:
                      - 25HRA0B2
                  minItems: 1
                  description: One or more Movement IDs delivered together at this delivery.
                carrier:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Carrier
                  description: A single waste carrier. organisationName, meansOfTransport and contactDetails are required, and exactly one of registrationNumber or reasonForNoRegistrationNumber must be provided. vehicleRegistration is required for Road and otherMeansOfTransport for Other; each is forbidden otherwise. address is optional.
                  type: object
                  allOf:
                    - if:
                        properties:
                          registrationNumber: {}
                        required:
                          - registrationNumber
                      then:
                        properties:
                          reasonForNoRegistrationNumber:
                            not: {}
                            description: Not allowed when 'registrationNumber' is provided
                      else:
                        properties:
                          reasonForNoRegistrationNumber: {}
                        required:
                          - reasonForNoRegistrationNumber
                        description: Required when 'registrationNumber' is not provided
                    - if:
                        properties:
                          meansOfTransport:
                            const: Road
                        required:
                          - meansOfTransport
                      then:
                        properties:
                          vehicleRegistration: {}
                        required:
                          - vehicleRegistration
                        description: Required when 'meansOfTransport' is 'Road'
                      else:
                        properties:
                          vehicleRegistration:
                            not: {}
                            description: Not allowed unless 'meansOfTransport' is 'Road'
                    - if:
                        properties:
                          meansOfTransport:
                            const: Other
                        required:
                          - meansOfTransport
                      then:
                        properties:
                          otherMeansOfTransport: {}
                        required:
                          - otherMeansOfTransport
                        description: Required when 'meansOfTransport' is 'Other'
                      else:
                        properties:
                          otherMeansOfTransport:
                            not: {}
                            description: Not allowed unless 'meansOfTransport' is 'Other'
                  properties:
                    organisationName:
                      type: string
                      minLength: 1
                      description: Name of the carrier organisation.
                    registrationNumber:
                      description: Waste carrier registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Mutually exclusive with reasonForNoRegistrationNumber — exactly one of the two is required.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Registration number
                      type: string
                      pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
                    reasonForNoRegistrationNumber:
                      type: string
                      enum:
                        - ON_SITE
                        - HOUSEHOLD
                        - ONE_OFF
                        - MARINE
                      description: Why the carrier has no registration number. Mutually exclusive with registrationNumber — exactly one of the two is required.
                    meansOfTransport:
                      type: string
                      enum:
                        - Road
                        - Rail
                        - Air
                        - Sea
                        - Inland Waterway
                        - Piped
                        - Other
                      description: How the carrier will transport the waste.
                    vehicleRegistration:
                      type: string
                      minLength: 1
                      description: Registration of the vehicle carrying the waste. Required when meansOfTransport is Road; forbidden otherwise.
                    otherMeansOfTransport:
                      type: string
                      minLength: 1
                      description: Description of the means of transport. Required when meansOfTransport is Other; forbidden otherwise.
                    contactDetails:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Contact details
                      description: Contact details for a party. At least one of emailAddress or phoneNumber must be provided.
                      examples:
                        - emailAddress: producer@example.com
                          phoneNumber: '01234567890'
                        - emailAddress: producer@example.com
                      type: object
                      properties:
                        emailAddress:
                          type: string
                          format: email
                          description: Contact email address.
                        phoneNumber:
                          type: string
                          pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                          description: Contact phone number, in a valid format.
                      anyOf:
                        - properties:
                            emailAddress: {}
                          required:
                            - emailAddress
                        - properties:
                            phoneNumber: {}
                          required:
                            - phoneNumber
                      additionalProperties: false
                    address:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Address
                      description: A UK or Irish postal address. fullAddress is optional; postcode is required.
                      examples:
                        - fullAddress: 10 Industrial Way, Test City
                          postcode: TE1 2PQ
                      type: object
                      properties:
                        fullAddress:
                          type: string
                          minLength: 1
                          description: Full address line.
                        postcode:
                          type: string
                          pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                          description: Accepts UK postcodes and Irish Eircodes.
                      required:
                        - postcode
                      additionalProperties: false
                  required:
                    - organisationName
                    - meansOfTransport
                    - contactDetails
                  additionalProperties: false
                supportingReferences:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Supporting references
                  description: label/reference pairs for the movement. Both reference and label are required for every entry.
                  examples:
                    - - label: PO Number
                        reference: PO-123456
