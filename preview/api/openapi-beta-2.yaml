                        - R8
                        - R9
                        - R10
                        - R11
                        - R12
                        - R13
                        - D1
                        - D2
                        - D3
                        - D4
                        - D5
                        - D6
                        - D7
                        - D8
                        - D9
                        - D10
                        - D11
                        - D12
                        - D13
                        - D14
                        - D15
                      description: The recovery (R1–R13) or disposal (D1–D15) operation code. Case-sensitive.
                    weight:
