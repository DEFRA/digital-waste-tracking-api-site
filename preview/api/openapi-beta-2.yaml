        brokerOrDealer:
          description: Any broker or dealer involved in the movement.
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Broker or dealer involvement
          examples:
            - isPresent: true
              items:
                - organisationName: Broker Demo Ltd
                  registrationNumber: CBDU654321
                  contactDetails:
                    emailAddress: broker@example.com
                    phoneNumber: '01112223333'
                  address:
                    fullAddress: 2 Broker Yard, Test City
                    postcode: TE1 1ST
            - isPresent: false
          type: object
          if:
            properties:
              isPresent:
                const: true
            required:
              - isPresent
          then:
            properties:
              items: {}
            required:
              - items
            description: Required when 'isPresent' is true
          else:
            properties:
              items:
                not: {}
                description: Not allowed when 'isPresent' is false or absent
          properties:
            isPresent:
              type: boolean
              description: Whether a broker or dealer was involved in arranging the movement. Absent is equivalent to false.
            items:
              type: array
              minItems: 1
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Broker or dealer
                description: A single broker or dealer who arranged the Movement. organisationName and contactDetails are required, and exactly one of registrationNumber or reasonForNoRegistrationNumber must be provided. address is optional.
                examples:
                  - organisationName: Broker Demo Ltd
                    registrationNumber: CBDU654321
                    contactDetails:
                      emailAddress: broker@example.com
                      phoneNumber: '01112223333'
                    address:
                      fullAddress: 2 Broker Yard, Test City
                      postcode: TE1 1ST
                  - organisationName: Broker Demo Ltd
                    reasonForNoRegistrationNumber: ONE_OFF
                    contactDetails:
                      emailAddress: broker@example.com
                type: object
                if:
                  properties:
                    registrationNumber: {}
                  required:
                    - registrationNumber
                then:
                  properties:
                    reasonForNoRegistrationNumber:
                      not: {}
                      description: Not allowed when 'registrationNumber' is provided
                else:
                  properties:
                    reasonForNoRegistrationNumber: {}
                  required:
                    - reasonForNoRegistrationNumber
                  description: Required when 'registrationNumber' is not provided
                properties:
                  organisationName:
                    type: string
                    minLength: 1
                    description: Name of the broker or dealer organisation who arranged this Movement.
                  registrationNumber:
                    description: Waste carrier, broker or dealer registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Exactly one of 'registrationNumber' or 'reasonForNoRegistrationNumber' is required.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Registration number
                    examples:
                      - CBDU123456
                    type: string
                    pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
                  reasonForNoRegistrationNumber:
                    type: string
                    minLength: 1
                    description: Reason no registrationNumber is held. Free text for now — enum values TBC pending BA/policy input. Exactly one of 'registrationNumber' or 'reasonForNoRegistrationNumber' is required.
                  contactDetails:
                    description: How to contact the broker or dealer.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Contact details
                    examples:
                      - emailAddress: producer@example.com
                        phoneNumber: '01234567890'
                      - emailAddress: producer@example.com
                    type: object
                    properties:
                      emailAddress:
                        type: string
                        format: email
                        description: Contact email address.
                      phoneNumber:
                        type: string
                        pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                        description: Contact phone number, in a valid format.
