                - postcode
              additionalProperties: false
            contactDetails:
              description: How to contact the receiving site. At least one of emailAddress or phoneNumber is required.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Contact details
              examples:
                - emailAddress: producer@example.com
                  phoneNumber: '01234567890'
                - emailAddress: producer@example.com
              type: object
              properties:
                emailAddress:
                  type: string
                  format: email
                  description: Contact email address.
                phoneNumber:
                  type: string
                  pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                  description: Contact phone number, in a valid format.
              anyOf:
                - properties:
                    emailAddress: {}
                  required:
                    - emailAddress
                - properties:
                    phoneNumber: {}
                  required:
                    - phoneNumber
              additionalProperties: false
          required:
            - siteName
            - authorisationNumber
            - receiptAddress
            - contactDetails
          additionalProperties: false
        wasteItems:
          type: array
          items:
            type: object
            properties:
              classification:
                description: 'What the waste item is: its description, EWC codes, POPs and hazardous properties.'
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Waste item classification
                examples:
                  - wasteDescription: Mixed municipal waste
                    ewcCodes:
                      - '200301'
                    pops:
                      isPresent: false
                    hazardous:
                      isPresent: false
                  - wasteDescription: Fluorescent tubes
                    ewcCodes:
                      - '200121'
                    pops:
                      isPresent: true
                      sourceOfComponents: GUIDANCE
                      components:
                        - code: PFOS
                          concentrationThresholdOperator: LESS_THAN
                    hazardous:
                      isPresent: true
                      codes:
                        - HP_6
                        - HP_14
                type: object
                properties:
                  wasteDescription:
                    type: string
                    minLength: 1
                    description: A free-text description of the waste. An empty string is treated as not provided.
                  ewcCodes:
                    type: array
                    items:
                      type: string
                      pattern: ^\d{6}$
                      description: 'A European Waste Catalogue (EWC) code: six digits, with no spaces. Only the format is checked here; the service also checks the code is one of those served by GET /reference-data/ewc-codes, which is too long a list to inline, and reports an unrecognised code as an InvalidValue error.'
                    minItems: 1
                    maxItems: 5
                    description: 'The EWC codes that describe the waste: at least one, and up to five to allow for dual and mirror codes. Each must be six digits and a code from GET /reference-data/ewc-codes; the service checks the second.'
                  pops:
                    description: Whether the waste item contains persistent organic pollutants, and if so which. Required, even when there are none.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Persistent organic pollutants
                    examples:
                      - isPresent: false
                      - isPresent: true
                        sourceOfComponents: OWN_TESTING
                        components:
                          - code: PFOA
                            concentration: 0.5
                          - code: PFOS
                            concentrationThresholdOperator: LESS_THAN
                    type: object
                    if:
                      properties:
                        isPresent:
                          const: true
                      required:
                        - isPresent
                    then:
                      properties:
                        sourceOfComponents: {}
                        components: {}
                      required:
                        - sourceOfComponents
                        - components
                      description: Required when 'isPresent' is true
                    else:
                      properties:
                        sourceOfComponents:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                        components:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                    properties:
                      isPresent:
                        type: boolean
                        description: Whether the waste item contains any persistent organic pollutants.
                      sourceOfComponents:
                        type: string
                        enum:
                          - GUIDANCE
                          - PROVIDED_WITH_WASTE
                          - OWN_TESTING
                          - NOT_PROVIDED
                        description: 'Where the POP details came from: government guidance, provided with the waste, the receiver''s own testing or analysis, or not provided. Required when isPresent is true; not allowed otherwise.'
                      components:
                        type: array
                        minItems: 1
                        items:
                          $schema: https://json-schema.org/draft/2020-12/schema
                          title: POP component
                          description: 'A persistent organic pollutant (POP) in a waste item: its code, and either its concentration or how its concentration compares with the threshold WM3 sets for that code, but not both. A concentration of null or an empty string is treated as not provided.'
                          examples:
                            - code: PFOA
                              concentration: 0.5
                            - code: PFOS
                              concentrationThresholdOperator: LESS_THAN
                          type: object
                          allOf:
                            - if:
                                properties:
                                  concentration:
                                    type: number
                                required:
                                  - concentration
                              then:
                                properties:
                                  concentrationThresholdOperator:
                                    not: {}
                                    description: Not allowed when 'concentration' is provided
                              else:
                                properties:
                                  concentrationThresholdOperator: {}
                                required:
                                  - concentrationThresholdOperator
                                description: Required when 'concentration' is not provided
                          properties:
                            code:
                              type: string
                              minLength: 1
                              description: The POP's code, from GET /reference-data/pop-names. Only checked for being non-empty here; the service checks it against the reference data and reports an unrecognised code as an InvalidValue error.
                            concentration:
                              if:
                                type: number
                              then:
                                type: number
                                exclusiveMinimum: 0
                                description: Must be greater than 0
                              else:
                                enum:
                                  - null
                                  - ''
                                description: Must be a number greater than 0, or null or an empty string when not provided
                              description: 'The POP''s concentration: a number greater than 0. null or an empty string means not provided. Exactly one of ''concentration'' or ''concentrationThresholdOperator'' is required.'
                            concentrationThresholdOperator:
                              type: string
                              enum:
                                - LESS_THAN
                                - EQUAL_TO
                                - GREATER_THAN
                              description: How the POP's concentration compares with the threshold WM3 sets for its code, when the concentration itself isn't given. The threshold value isn't sent. Exactly one of 'concentration' or 'concentrationThresholdOperator' is required.
                          required:
                            - code
                          additionalProperties: false
                        description: The POPs the waste item contains. At least one is required when isPresent is true, whatever the source; not allowed otherwise.
                    required:
                      - isPresent
                    additionalProperties: false
                  hazardous:
                    description: Whether the waste item has hazardous properties, and if so which. Required, even when there are none. A movement is hazardous when any of its waste items declares hazardous properties.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Hazardous properties
                    examples:
                      - isPresent: true
                        codes:
                          - HP_4
                          - HP_8
                      - isPresent: false
                    type: object
                    if:
                      properties:
                        isPresent:
                          const: true
                      required:
                        - isPresent
                    then:
                      properties:
                        codes: {}
                      required:
                        - codes
                      description: Required when 'isPresent' is true
                    else:
                      properties:
                        codes:
                          not: {}
                          description: Not allowed unless 'isPresent' is true
                    properties:
                      isPresent:
                        type: boolean
                        description: Whether the waste item has any hazardous properties.
                      codes:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          enum:
                            - HP_1
                            - HP_2
                            - HP_3
                            - HP_4
                            - HP_5
                            - HP_6
                            - HP_7
                            - HP_8
                            - HP_9
                            - HP_10
                            - HP_11
                            - HP_12
                            - HP_13
                            - HP_14
                            - HP_15
                            - HP_POP
                          description: 'A hazardous property code: HP_1 to HP_15, or HP_POP.'
                        description: The hazardous property codes that apply to the waste item. At least one is required when isPresent is true; not allowed otherwise. Duplicates are accepted.
                    required:
                      - isPresent
                    additionalProperties: false
                required:
                  - wasteDescription
                  - ewcCodes
                  - pops
                  - hazardous
                additionalProperties: false
              physicalDetails:
                description: The physical form, containers and total weight of the waste item.
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Physical details
                type: object
                allOf:
                  - if:
                      properties:
                        containerType:
                          const: LOO
                      required:
                        - containerType
                    then:
                      properties:
                        containerCount:
                          const: 0
                          description: Must be 0 when the waste is loose (containerType LOO).
                    else:
                      properties:
                        containerCount:
                          type: integer
                          minimum: 1
                          description: Must be at least 1 unless the waste is loose (containerType LOO).
                properties:
                  form:
                    type: string
                    enum:
                      - GAS
                      - LIQUID
                      - SOLID
                      - POWDER
                      - SLUDGE
                      - MIXED
                    description: The physical form of the waste. Case-sensitive.
                  containerType:
                    type: string
                    enum:
                      - BAG
                      - BAL
                      - BOX
                      - CAN
                      - CAR
                      - CAS
                      - CON
                      - DRU
                      - FIB
                      - IBC
                      - LOO
                      - PAL
                      - ROR
                      - SKI
                      - TAN
                      - WBI
                    description: Code for how the waste is contained. LOO means the waste is loose, with no containers. Case-sensitive.
                  containerCount:
                    type: integer
                    minimum: 0
                    description: 'The number of containers: a whole number of 0 or more. Must be 0 when containerType is LOO, and at least 1 for any other container type.'
                  totalWeight:
                    description: The total weight of the waste item.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Weight
                    type: object
                    properties:
                      amount:
                        type: number
                        exclusiveMinimum: 0
                        description: The weight, in the given unit. Must be greater than 0.
                      unit:
                        type: string
                        enum:
                          - GRAMS
                          - KILOGRAMS
                          - TONNES
                        description: The unit the amount is measured in. Case-sensitive.
                      isEstimate:
                        type: boolean
                        description: Whether the weight is estimated (true) or actual (false).
                    required:
                      - amount
                      - unit
                      - isEstimate
                    additionalProperties: false
                required:
                  - form
                  - containerType
                  - containerCount
                  - totalWeight
                additionalProperties: false
              treatments:
                description: 'Required on every waste item of a receipt: at least one disposal or recovery operation'
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Treatments
                type: array
                minItems: 1
                items:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Treatment
                  description: A disposal or recovery operation applied to the waste, and the weight of waste it applies to. Both are required. disposalOrRecoveryCode mirrors DISPOSAL_OR_RECOVERY_CODES from @defra/waste-movement-utils.
                  examples:
                    - disposalOrRecoveryCode: R3
                      weight:
                        amount: 250.5
                        unit: KILOGRAMS
                        isEstimate: false
                  type: object
                  properties:
                    disposalOrRecoveryCode:
                      type: string
                      enum:
                        - R1
                        - R2
                        - R3
                        - R4
                        - R5
                        - R6
                        - R7
                        - R8
                        - R9
                        - R10
                        - R11
                        - R12
                        - R13
                        - D1
                        - D2
                        - D3
                        - D4
                        - D5
                        - D6
                        - D7
                        - D8
                        - D9
                        - D10
                        - D11
                        - D12
                        - D13
                        - D14
                        - D15
                      description: The recovery (R1–R13) or disposal (D1–D15) operation code. Case-sensitive.
                    weight:
                      description: The weight of waste this treatment applies to.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Weight
                      type: object
                      properties:
                        amount:
                          type: number
                          exclusiveMinimum: 0
                          description: The weight, in the given unit. Must be greater than 0.
                        unit:
                          type: string
                          enum:
                            - GRAMS
                            - KILOGRAMS
                            - TONNES
                          description: The unit the amount is measured in. Case-sensitive.
                        isEstimate:
                          type: boolean
                          description: Whether the weight is estimated (true) or actual (false).
                      required:
                        - amount
                        - unit
                        - isEstimate
                      additionalProperties: false
                  required:
                    - disposalOrRecoveryCode
                    - weight
                  additionalProperties: false
            required:
              - treatments
            $schema: https://json-schema.org/draft/2020-12/schema
            title: Waste item
            description: A single item of waste in a movement. classification and physicalDetails are required; treatments is optional.
            examples:
              - classification:
                  wasteDescription: Mixed municipal waste
                  ewcCodes:
                    - '200301'
                  pops:
                    isPresent: false
                  hazardous:
                    isPresent: false
                physicalDetails:
                  form: SOLID
                  containerType: DRU
                  containerCount: 4
                  totalWeight:
                    amount: 250.5
                    unit: KILOGRAMS
                    isEstimate: false
                treatments:
                  - disposalOrRecoveryCode: R3
                    weight:
                      amount: 250.5
                      unit: KILOGRAMS
                      isEstimate: false
              - classification:
                  wasteDescription: Soil and stones
                  ewcCodes:
                    - '170504'
                  pops:
                    isPresent: false
                  hazardous:
                    isPresent: false
                physicalDetails:
                  form: MIXED
                  containerType: LOO
                  containerCount: 0
                  totalWeight:
                    amount: 2
                    unit: TONNES
                    isEstimate: true
            additionalProperties: false
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Waste items
          description: The items of waste in a movement. At least one is required.
          minItems: 1
        brokerOrDealer:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Broker or dealer involvement
          description: 'Declares whether any broker or dealer was involved in the movement, and their details. isPresent gates the items array: when true at least one entry is required, when false or absent entries are forbidden.'
          examples:
            - isPresent: true
              items:
                - organisationName: Broker Demo Ltd
                  registrationNumber: CBDU654321
                  contactDetails:
                    emailAddress: broker@example.com
                    phoneNumber: '01112223333'
                  address:
                    fullAddress: 2 Broker Yard, Test City
                    postcode: TE1 1ST
            - isPresent: false
          type: object
          if:
            properties:
              isPresent:
                const: true
            required:
              - isPresent
          then:
            properties:
              items: {}
            required:
              - items
            description: Required when 'isPresent' is true
          else:
            properties:
              items:
                not: {}
                description: Not allowed when 'isPresent' is false or absent
          properties:
            isPresent:
              type: boolean
              description: Whether a broker or dealer was involved in arranging the movement. Absent is equivalent to false.
            items:
              type: array
              minItems: 1
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Broker or dealer
                description: A single broker or dealer who arranged the transfer. organisationName and contactDetails are required, and exactly one of registrationNumber or reasonForNoRegistrationNumber must be provided. address is optional.
                examples:
                  - organisationName: Broker Demo Ltd
                    registrationNumber: CBDU654321
                    contactDetails:
                      emailAddress: broker@example.com
                      phoneNumber: '01112223333'
                    address:
                      fullAddress: 2 Broker Yard, Test City
                      postcode: TE1 1ST
                  - organisationName: Broker Demo Ltd
                    reasonForNoRegistrationNumber: ONE_OFF
                    contactDetails:
                      emailAddress: broker@example.com
                type: object
                if:
                  properties:
                    registrationNumber: {}
                  required:
                    - registrationNumber
                then:
                  properties:
                    reasonForNoRegistrationNumber:
                      not: {}
                      description: Not allowed when 'registrationNumber' is provided
                else:
                  properties:
                    reasonForNoRegistrationNumber: {}
                  required:
                    - reasonForNoRegistrationNumber
                  description: Required when 'registrationNumber' is not provided
                properties:
                  organisationName:
                    type: string
                    minLength: 1
                    description: Name of the broker or dealer organisation who arranged this transfer.
                  registrationNumber:
                    description: Waste carrier, broker or dealer registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Mutually exclusive with reasonForNoRegistrationNumber — exactly one of the two is required.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Registration number
                    type: string
                    pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
                  reasonForNoRegistrationNumber:
                    type: string
                    minLength: 1
                    description: Reason no registrationNumber is held. Free text for now — enum values TBC pending BA/policy input. Mutually exclusive with registrationNumber — exactly one of the two is required.
                  contactDetails:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Contact details
                    description: Contact details for a party. At least one of emailAddress or phoneNumber must be provided.
                    examples:
                      - emailAddress: producer@example.com
                        phoneNumber: '01234567890'
                      - emailAddress: producer@example.com
                    type: object
                    properties:
                      emailAddress:
                        type: string
                        format: email
                        description: Contact email address.
                      phoneNumber:
                        type: string
                        pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                        description: Contact phone number, in a valid format.
                    anyOf:
                      - properties:
                          emailAddress: {}
                        required:
                          - emailAddress
                      - properties:
                          phoneNumber: {}
                        required:
                          - phoneNumber
                    additionalProperties: false
                  address:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Address
                    description: A UK or Irish postal address. fullAddress is optional; postcode is required.
                    examples:
                      - fullAddress: 10 Industrial Way, Test City
                        postcode: TE1 2PQ
                    type: object
                    properties:
                      fullAddress:
                        type: string
                        minLength: 1
                        description: Full address line.
                      postcode:
                        type: string
                        pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                        description: Accepts UK postcodes and Irish Eircodes.
                    required:
                      - postcode
                    additionalProperties: false
                required:
                  - organisationName
                  - contactDetails
                additionalProperties: false
              description: The brokers or dealers involved. Required with at least one entry when isPresent is true, and must not be provided otherwise. More than one may be declared.
          additionalProperties: false
        supportingReferences:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Supporting references
          description: label/reference pairs for the movement. Both reference and label are required for every entry.
          examples:
            - - label: PO Number
                reference: PO-123456
              - label: Job Number
                reference: CARRIER-JOB-001
          type: array
          minItems: 1
          items:
            type: object
            properties:
              reference:
                type: string
                minLength: 1
                maxLength: 50
                description: Reference value — must be supplied together with its label.
              label:
                type: string
                enum:
                  - Weighbridge Number
                  - PO Number
                  - Job Number
                  - Invoice Number
                  - Waste Ticket Number
                  - Other
                description: Label identifying the reference type.
            required:
              - reference
              - label
            additionalProperties: false
        consignmentNote:
          description: The hazardous waste consignment note. Required when any waste item declares hazardous properties.
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Consignment note
          examples:
            - code: CJTILE/A0001
            - reasonForNoCode: Carrier did not provide a consignment note
          type: object
          allOf:
            - if:
                properties:
                  code:
                    type: string
                    minLength: 1
                required:
                  - code
              then:
                properties:
                  reasonForNoCode:
                    not:
                      type: string
                      minLength: 1
                    description: Not allowed when 'code' is provided
          properties:
            code:
              type:
                - string
                - 'null'
              pattern: ^(?:|[A-Za-z0-9]{2,}/[A-Za-z0-9]{5}[A-Za-z]?|S[ABC]\d{7}|D[ABC]\d{7})$
              description: The consignment note code, in an EA / NRW (CJTILE/A0001), SEPA (SA1234567) or NIEA (DA1234567) format. Mirrors the hazardous waste consignment patterns from @defra/waste-movement-utils, as one pattern. Required when any waste item declares hazardous properties, unless 'reasonForNoCode' is provided; also accepted for non-hazardous waste.
            reasonForNoCode:
              type:
                - string
                - 'null'
              description: 'Free text: why there is no consignment note code. Required when any waste item declares hazardous properties and ''code'' is not provided; not allowed when ''code'' is provided.'
          additionalProperties: false
      required:
        - reasonForNoDeliveryId
        - carrier
        - receiver
        - wasteItems
      additionalProperties: false
    issue:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: Issue
      description: A single problem with a submitted field, located by JSON Pointer.
      type: object
      required:
        - pointer
        - errorType
        - message
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON Pointer to the field this issue relates to.
          examples:
            - /producer
        errorType:
          type: string
          enum:
            - NotProvided
            - NotAllowed
            - InvalidType
            - InvalidFormat
            - InvalidValue
            - OutOfRange
            - BusinessRuleViolation
            - UnexpectedError
          description: The type of issue.
          examples:
            - NotProvided
        message:
          type: string
          description: Human-readable description of the issue.
          examples:
            - '''producer'' is required'
      additionalProperties: false
    problemDetails:
      type: object
      description: RFC 9457 Problem Details (`application/problem+json`).
      required:
        - type
        - title
        - detail
        - instance
        - requestId
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem kind.
          example: https://defra.github.io/digital-waste-tracking-api-site/preview/problems/bad-request
        title:
          type: string
          description: Short, stable summary for this problem type.
          example: Request validation failed
        detail:
          type: string
          description: Human-readable detail specific to this occurrence.
          example: The request could not be stored because 1 field is invalid.
        instance:
          type: string
          description: The request path where the problem occurred.
          example: /movements
        requestId:
          type: string
          description: Trace id for this request, matching the `x-request-id` header.
        errors:
          type: array
          items:
            $schema: https://json-schema.org/draft/2020-12/schema
            title: Issue
            description: A single problem with a submitted field, located by JSON Pointer.
            type: object
            required:
              - pointer
              - errorType
              - message
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the field this issue relates to.
                examples:
                  - /producer
              errorType:
                type: string
                enum:
                  - NotProvided
                  - NotAllowed
                  - InvalidType
                  - InvalidFormat
                  - InvalidValue
                  - OutOfRange
                  - BusinessRuleViolation
                  - UnexpectedError
                description: The type of issue.
                examples:
                  - NotProvided
              message:
                type: string
                description: Human-readable description of the issue.
                examples:
                  - '''producer'' is required'
            additionalProperties: false
          description: Field-level problems. Present on 400 responses; omitted otherwise.
      additionalProperties: false
    createMovementResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: Create movement response
      description: Response returned when a movement is created.
      type: object
      required:
        - data
        - validation
      properties:
        data:
          type: object
          description: The created movement.
          required:
            - movementId
          properties:
            movementId:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Movement ID
              description: 'Unique identifier for a waste movement, minted by the server on `POST /movements`. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
              type: string
              pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
              examples:
                - 25HRA0B2
          additionalProperties: false
        validation:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Validation
          description: Data-quality feedback returned alongside a successful response.
          examples:
            - warnings: []
          type: object
          required:
            - warnings
          properties:
            warnings:
              type: array
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Issue
                description: A single problem with a submitted field, located by JSON Pointer.
                type: object
                required:
                  - pointer
                  - errorType
                  - message
                properties:
                  pointer:
                    type: string
                    description: RFC 6901 JSON Pointer to the field this issue relates to.
                    examples:
                      - /producer
                  errorType:
                    type: string
                    enum:
