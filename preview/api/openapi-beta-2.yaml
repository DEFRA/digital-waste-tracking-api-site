paths:
  /movements:
    post:
      tags:
        - Movement
      summary: Create a waste movement
      description: Creates a new waste movement and returns its Movement ID.
      operationId: createMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Create movement request
              description: Payload for POST /beta-2/movements. A consignmentNote is required when any waste item declares hazardous properties; the service checks that, as the rule spans the waste items and the consignment note.
              type: object
              properties:
                producer:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Producer
                  description: The organisation or party the waste originates from. Required fields vary by wasteSource — see the variants below. For Commercial and Municipal, contactDetails is required (with at least one of emailAddress or phoneNumber within it), and exactly one of authorisationNumber or reasonForNoAuthorisationNumber must be provided; not applicable for Household, where contactDetails and the rest remain forbidden.
                  examples:
                    - wasteSource: Commercial
                      organisationName: ACME Waste Producers Ltd
                      authorisationNumber: EAS/P/123456
                      sicCode: '38110'
                      address:
                        fullAddress: 10 Industrial Way, Test City
                        postcode: TE1 2PQ
                      contactDetails:
                        emailAddress: producer@example.com
                        phoneNumber: '01234567890'
                    - wasteSource: Municipal
                      organisationName: Test Council
                      reasonForNoAuthorisationNumber: TBC
                      address:
                        fullAddress: Council Depot, Test City
                        postcode: TE1 5CD
                      contactDetails:
                        emailAddress: waste.services@example.gov.uk
                        phoneNumber: '01234567890'
                    - wasteSource: Household
                  oneOf:
                    - $schema: https://json-schema.org/draft/2020-12/schema
                      title: Producer (Household)
                      description: Producer fields specific to household waste. organisationName, authorisationNumber, sicCode, contactDetails and address do not apply and must not be provided.
                      examples:
                        - wasteSource: Household
                      type: object
                      allOf:
                        - $schema: https://json-schema.org/draft/2020-12/schema
                          title: Producer base fields
                          description: Fields present on every Producer, regardless of wasteSource.
                          type: object
                          properties: {}
                        - type: object
                          properties:
                            wasteSource:
                              const: Household
                              description: Waste originates from a household.
                          required:
                            - wasteSource
                      propertyNames:
                        enum:
                          - wasteSource
                    - $schema: https://json-schema.org/draft/2020-12/schema
                      title: Producer (Commercial)
                      description: Producer fields specific to commercial waste. organisationName, sicCode, address and contactDetails are required. Exactly one of authorisationNumber or reasonForNoAuthorisationNumber must be provided.
                      examples:
                        - wasteSource: Commercial
                          organisationName: ACME Waste Producers Ltd
                          authorisationNumber: EAS/P/123456
                          sicCode: '38110'
                          address:
                            fullAddress: 10 Industrial Way, Test City
                            postcode: TE1 2PQ
                          contactDetails:
                            emailAddress: producer@example.com
                            phoneNumber: '01234567890'
                      type: object
                      allOf:
                        - $schema: https://json-schema.org/draft/2020-12/schema
                          title: Producer base fields
                          description: Fields present on every Producer, regardless of wasteSource.
                          type: object
                          properties: {}
                        - type: object
                          if:
                            properties:
                              authorisationNumber: {}
                            required:
                              - authorisationNumber
                          then:
                            properties:
                              reasonForNoAuthorisationNumber:
                                not: {}
                                description: Not allowed when 'authorisationNumber' is provided
                          else:
                            properties:
                              reasonForNoAuthorisationNumber: {}
                            required:
                              - reasonForNoAuthorisationNumber
                            description: Required when 'authorisationNumber' is not provided
                          properties:
                            wasteSource:
                              const: Commercial
                              description: Waste originates from a commercial source.
                            organisationName:
                              type: string
                              minLength: 1
                              description: Producer organisation name.
                            authorisationNumber:
                              type: string
                              pattern: ^\s*(?:(?:[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Aa][Ww][Mm][Ll]\d{5,6})|(?:[Ww][Mm][Ll]\d{5,6})|(?:[Pp][Pp][Cc]\/[AaWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7}\/\d{2})|(?:[Pp][Pp][Cc]\/[Aa]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ww][Mm][Ll]\/[Ll]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ee][Aa][Ss]\/[Pp]\/\d{6})|(?:[Pp]\d{4}\/\d{2}[A-Za-z])|(?:[Pp]\d{4}\/\d{2}[A-Za-z]\/[Vv]\d+)|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2})|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2}\/[Vv]\d+)|(?:[Ww][Mm][Ll] \d{2}\/\d+(\/[Tt])? [Ll][Nn]\/\d{2}\/\d+(\/([MmTtCcNn]|[Vv]\d+))*)|(?:[Ww][Mm][Ll] \d{2}\/\d+ [Pp][Aa][Cc]\/\d{4}\/[Ww][Cc][Ll]\d{3}))\s*$
                              description: Producer environmental permit or exemption number, in a valid UK format. Mutually exclusive with reasonForNoAuthorisationNumber — exactly one of the two is required.
                            reasonForNoAuthorisationNumber:
                              type: string
                              minLength: 1
                              description: Reason no authorisationNumber is held. Free text for now — enum values TBC pending BA/policy input. Mutually exclusive with authorisationNumber — exactly one of the two is required.
                            sicCode:
                              type: string
                              pattern: ^\d{5}$
                              description: Five-digit Standard Industrial Classification code.
                            contactDetails:
                              $schema: https://json-schema.org/draft/2020-12/schema
                              title: Contact details
                              description: Contact details for a party. At least one of emailAddress or phoneNumber must be provided.
                              examples:
                                - emailAddress: producer@example.com
                                  phoneNumber: '01234567890'
                                - emailAddress: producer@example.com
                              type: object
                              properties:
                                emailAddress:
                                  type: string
                                  format: email
                                  description: Contact email address.
                                phoneNumber:
                                  type: string
                                  pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                                  description: Contact phone number, in a valid format.
                              anyOf:
                                - properties:
                                    emailAddress: {}
                                  required:
                                    - emailAddress
                                - properties:
                                    phoneNumber: {}
                                  required:
                                    - phoneNumber
                              additionalProperties: false
                            address:
                              $schema: https://json-schema.org/draft/2020-12/schema
                              title: Address
                              description: A UK or Irish postal address. fullAddress is optional; postcode is required.
                              examples:
                                - fullAddress: 10 Industrial Way, Test City
                                  postcode: TE1 2PQ
                              type: object
                              properties:
                                fullAddress:
                                  type: string
                                  minLength: 1
                                  description: Full address line.
                                postcode:
                                  type: string
                                  pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                                  description: Accepts UK postcodes and Irish Eircodes.
                              required:
                                - postcode
                              additionalProperties: false
                          required:
                            - wasteSource
                            - organisationName
                            - sicCode
                            - address
                            - contactDetails
                      propertyNames:
                        enum:
                          - wasteSource
                          - organisationName
                          - authorisationNumber
                          - reasonForNoAuthorisationNumber
                          - sicCode
                          - contactDetails
                          - address
