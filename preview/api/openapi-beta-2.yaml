  /deliveries:
    post:
      tags:
        - Delivery
      summary: Record a delivery
      description: Records a delivery event. All the non-hazardous Movements share one new Delivery ID; each hazardous Movement gets its own Delivery, whose Delivery ID is its Movement ID.
      operationId: recordDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Record delivery request
              description: Payload for POST /beta-2/deliveries.
              type: object
              properties:
                movementIds:
                  type: array
                  items:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Movement ID
                    description: 'Unique identifier for a waste movement, minted by the server on `POST /movements`. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
                    type: string
                    pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
                    examples:
                      - 25HRA0B2
                  minItems: 1
                  description: One or more Movement IDs delivered together at this delivery.
                carrier:
                  description: The carrier that delivered the waste.
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Carrier
                  examples:
                    - organisationName: Carrier Demo Ltd
                      registrationNumber: CBDU123456
                      meansOfTransport: ROAD
                      vehicleRegistration: AB12 CDE
                      contactDetails:
                        emailAddress: carrier@example.com
                        phoneNumber: '01234567890'
                      address:
                        fullAddress: 4 Carrier Lane, Test City
                        postcode: TE1 4CR
                  type: object
                  allOf:
                    - if:
                        properties:
                          registrationNumber: {}
                        required:
                          - registrationNumber
                      then:
                        properties:
                          reasonForNoRegistrationNumber:
                            not: {}
                            description: Not allowed when 'registrationNumber' is provided
                      else:
                        properties:
                          reasonForNoRegistrationNumber: {}
                        required:
                          - reasonForNoRegistrationNumber
                        description: Required when 'registrationNumber' is not provided
                    - if:
                        properties:
                          meansOfTransport:
                            const: ROAD
                        required:
                          - meansOfTransport
                      then:
                        properties:
                          vehicleRegistration: {}
                        required:
                          - vehicleRegistration
                        description: Required when 'meansOfTransport' is 'ROAD'
                      else:
                        properties:
                          vehicleRegistration:
                            not: {}
                            description: Not allowed unless 'meansOfTransport' is 'ROAD'
                    - if:
                        properties:
                          meansOfTransport:
                            const: OTHER
                        required:
                          - meansOfTransport
                      then:
                        properties:
                          otherMeansOfTransport: {}
                        required:
                          - otherMeansOfTransport
                        description: Required when 'meansOfTransport' is 'OTHER'
                      else:
                        properties:
                          otherMeansOfTransport:
                            not: {}
                            description: Not allowed unless 'meansOfTransport' is 'OTHER'
                  properties:
                    organisationName:
                      type: string
                      minLength: 1
                      description: Name of the carrier organisation.
                    registrationNumber:
                      description: Waste carrier registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Exactly one of 'registrationNumber' or 'reasonForNoRegistrationNumber' is required.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Registration number
                      examples:
                        - CBDU123456
                      type: string
                      pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
                    reasonForNoRegistrationNumber:
                      type: string
                      enum:
                        - ON_SITE
                        - HOUSEHOLD
                        - ONE_OFF
                        - MARINE
                      description: Why the carrier has no registration number. Exactly one of 'registrationNumber' or 'reasonForNoRegistrationNumber' is required.
                    meansOfTransport:
                      type: string
                      enum:
                        - ROAD
                        - RAIL
                        - AIR
                        - SEA
                        - INLAND_WATERWAY
                        - PIPED
                        - OTHER
                      description: How the carrier will transport the waste.
                    vehicleRegistration:
                      type: string
                      minLength: 1
                      description: Registration of the vehicle carrying the waste. Required when meansOfTransport is ROAD; forbidden otherwise.
                    otherMeansOfTransport:
                      type: string
                      minLength: 1
                      description: Description of the means of transport. Required when meansOfTransport is OTHER; forbidden otherwise.
                    contactDetails:
                      description: How to contact the carrier.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Contact details
                      examples:
                        - emailAddress: producer@example.com
                          phoneNumber: '01234567890'
                        - emailAddress: producer@example.com
                      type: object
                      properties:
                        emailAddress:
                          type: string
                          format: email
                          description: Contact email address.
                        phoneNumber:
                          type: string
                          pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                          description: Contact phone number, in a valid format.
                      if:
                        properties:
                          emailAddress: {}
                        required:
                          - emailAddress
                      else:
                        properties:
                          phoneNumber: {}
                        required:
                          - phoneNumber
                        description: Required when 'emailAddress' is not provided
                      additionalProperties: false
                    address:
                      description: The carrier's address.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Address
                      examples:
                        - fullAddress: 10 Industrial Way, Test City
                          postcode: TE1 2PQ
                      type: object
                      properties:
                        fullAddress:
                          type: string
                          minLength: 1
                          description: Full address line.
                        postcode:
                          type: string
                          pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                          description: Accepts UK postcodes and Irish Eircodes.
                      required:
                        - postcode
                      additionalProperties: false
                  required:
                    - organisationName
                    - meansOfTransport
                    - contactDetails
                  additionalProperties: false
                supportingReferences:
                  description: References that help identify the delivery, such as a PO or job number.
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Supporting references
                  examples:
                    - - label: PO_NUMBER
                        reference: PO-123456
