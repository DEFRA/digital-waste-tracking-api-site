  /movements/{movementId}/collection:
    parameters:
      - name: movementId
        in: path
        required: true
        description: Movement ID minted by `POST /movements`.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Movement ID
          description: 'Unique identifier for a waste movement, minted by the server on `POST /movements`. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
          type: string
          pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
          examples:
            - 25HRA0B2
        example: 25HRA0B2
    post:
      tags:
        - Collection
      summary: Record the collection for a movement
      description: Records a collection event for the given movement.
      operationId: recordCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Create collection request
              description: Payload for POST /beta-2/movements/{movementId}/collection.
              type: object
              properties:
                carrier:
                  description: The carrier that collected the waste.
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Carrier
