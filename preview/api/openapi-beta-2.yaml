              pattern: ^\s*(?:(?:[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Aa][Ww][Mm][Ll]\d{5,6})|(?:[Ww][Mm][Ll]\d{5,6})|(?:[Pp][Pp][Cc]\/[AaWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7}\/\d{2})|(?:[Pp][Pp][Cc]\/[Aa]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ww][Mm][Ll]\/[Ll]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ee][Aa][Ss]\/[Pp]\/\d{6})|(?:[Pp]\d{4}\/\d{2}[A-Za-z])|(?:[Pp]\d{4}\/\d{2}[A-Za-z]\/[Vv]\d+)|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2})|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2}\/[Vv]\d+)|(?:[Ww][Mm][Ll] \d{2}\/\d+(\/[Tt])? [Ll][Nn]\/\d{2}\/\d+(\/([MmTtCcNn]|[Vv]\d+))*)|(?:[Ww][Mm][Ll] \d{2}\/\d+ [Pp][Aa][Cc]\/\d{4}\/[Ww][Cc][Ll]\d{3}))\s*$
            receiptAddress:
              description: Address the waste will be received at. postcode is required; fullAddress is optional.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Address
              examples:
                - fullAddress: 10 Industrial Way, Test City
                  postcode: TE1 2PQ
              type: object
              properties:
                fullAddress:
                  type: string
                  minLength: 1
                  description: Full address line.
                postcode:
                  type: string
                  pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                  description: Accepts UK postcodes and Irish Eircodes.
              required:
                - postcode
              additionalProperties: false
            contactDetails:
              description: How to contact the receiving site. At least one of emailAddress or phoneNumber is required.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Contact details
              examples:
                - emailAddress: producer@example.com
                  phoneNumber: '01234567890'
                - emailAddress: producer@example.com
              type: object
              properties:
                emailAddress:
                  type: string
                  format: email
                  description: Contact email address.
                phoneNumber:
                  type: string
                  pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                  description: Contact phone number, in a valid format.
              anyOf:
                - properties:
                    emailAddress: {}
                  required:
                    - emailAddress
                - properties:
                    phoneNumber: {}
                  required:
                    - phoneNumber
              additionalProperties: false
          required:
            - siteName
            - authorisationNumber
            - receiptAddress
            - contactDetails
          additionalProperties: false
        physicalDetails:
          description: The physical form, containers and total weight of the waste received.
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Physical details
          type: object
          allOf:
            - if:
                properties:
                  containerType:
                    const: LOO
                required:
                  - containerType
              then:
                properties:
                  containerCount:
                    const: 0
                    description: Must be 0 when the waste is loose (containerType LOO).
              else:
                properties:
                  containerCount:
                    type: integer
                    minimum: 1
                    description: Must be at least 1 unless the waste is loose (containerType LOO).
          properties:
            form:
              type: string
              enum:
                - GAS
                - LIQUID
                - SOLID
                - POWDER
                - SLUDGE
                - MIXED
              description: The physical form of the waste. Case-sensitive.
            containerType:
              type: string
              enum:
                - BAG
                - BAL
                - BOX
                - CAN
                - CAR
                - CAS
                - CON
                - DRU
                - FIB
                - IBC
                - LOO
                - PAL
                - ROR
                - SKI
                - TAN
                - WBI
              description: Code for how the waste is contained. LOO means the waste is loose, with no containers. Case-sensitive.
            containerCount:
              type: integer
              minimum: 0
              description: 'The number of containers: a whole number of 0 or more. Must be 0 when containerType is LOO, and at least 1 for any other container type.'
            totalWeight:
              description: The total weight of the waste item.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Weight
              type: object
              properties:
                amount:
                  type: number
                  exclusiveMinimum: 0
                  description: The weight, in the given unit. Must be greater than 0.
                unit:
                  type: string
                  enum:
                    - GRAMS
                    - KILOGRAMS
                    - TONNES
                  description: The unit the amount is measured in. Case-sensitive.
                isEstimate:
                  type: boolean
                  description: Whether the weight is estimated (true) or actual (false).
              required:
                - amount
                - unit
                - isEstimate
              additionalProperties: false
          required:
            - form
            - containerType
            - containerCount
            - totalWeight
          additionalProperties: false
        hazardous:
          description: Whether the waste received has hazardous properties, and if so which. Required, even when there are none.
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Hazardous properties
          examples:
            - isPresent: true
              codes:
                - HP_4
                - HP_8
            - isPresent: false
          type: object
          if:
            properties:
              isPresent:
                const: true
            required:
              - isPresent
          then:
            properties:
              codes: {}
            required:
              - codes
            description: Required when 'isPresent' is true
          else:
            properties:
              codes:
                not: {}
                description: Not allowed unless 'isPresent' is true
          properties:
            isPresent:
              type: boolean
              description: Whether the waste item has any hazardous properties.
            codes:
              type: array
              minItems: 1
              items:
                type: string
                enum:
                  - HP_1
                  - HP_2
                  - HP_3
                  - HP_4
                  - HP_5
                  - HP_6
                  - HP_7
                  - HP_8
                  - HP_9
                  - HP_10
                  - HP_11
                  - HP_12
                  - HP_13
                  - HP_14
                  - HP_15
                  - HP_POP
                description: 'A hazardous property code: HP_1 to HP_15, or HP_POP.'
              description: The hazardous property codes that apply to the waste item. At least one is required when isPresent is true; not allowed otherwise. Duplicates are accepted.
          required:
            - isPresent
          additionalProperties: false
        treatments:
          description: The disposal or recovery operations applied to the waste received. At least one is required.
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Treatments
          type: array
          minItems: 1
          items:
            $schema: https://json-schema.org/draft/2020-12/schema
            title: Treatment
            description: A disposal or recovery operation applied to the waste, and the weight of waste it applies to. Both are required. disposalOrRecoveryCode mirrors DISPOSAL_OR_RECOVERY_CODES from @defra/waste-movement-utils.
            examples:
              - disposalOrRecoveryCode: R3
                weight:
                  amount: 250.5
                  unit: KILOGRAMS
                  isEstimate: false
            type: object
            properties:
              disposalOrRecoveryCode:
                type: string
                enum:
                  - R1
                  - R2
                  - R3
                  - R4
                  - R5
                  - R6
                  - R7
                  - R8
                  - R9
                  - R10
                  - R11
                  - R12
                  - R13
                  - D1
                  - D2
                  - D3
                  - D4
                  - D5
                  - D6
                  - D7
                  - D8
                  - D9
                  - D10
                  - D11
                  - D12
                  - D13
                  - D14
                  - D15
                description: The recovery (R1–R13) or disposal (D1–D15) operation code. Case-sensitive.
              weight:
                description: The weight of waste this treatment applies to.
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Weight
                type: object
                properties:
                  amount:
                    type: number
                    exclusiveMinimum: 0
                    description: The weight, in the given unit. Must be greater than 0.
                  unit:
                    type: string
                    enum:
                      - GRAMS
                      - KILOGRAMS
                      - TONNES
                    description: The unit the amount is measured in. Case-sensitive.
                  isEstimate:
                    type: boolean
                    description: Whether the weight is estimated (true) or actual (false).
                required:
                  - amount
                  - unit
                  - isEstimate
                additionalProperties: false
            required:
              - disposalOrRecoveryCode
              - weight
            additionalProperties: false
        brokerOrDealer:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Broker or dealer involvement
          description: 'Declares whether any broker or dealer was involved in the movement, and their details. isPresent gates the items array: when true at least one entry is required, when false or absent entries are forbidden.'
          examples:
            - isPresent: true
              items:
                - organisationName: Broker Demo Ltd
                  registrationNumber: CBDU654321
                  contactDetails:
                    emailAddress: broker@example.com
                    phoneNumber: '01112223333'
                  address:
                    fullAddress: 2 Broker Yard, Test City
                    postcode: TE1 1ST
            - isPresent: false
          type: object
          if:
            properties:
              isPresent:
                const: true
            required:
              - isPresent
          then:
            properties:
              items: {}
            required:
              - items
            description: Required when 'isPresent' is true
          else:
            properties:
              items:
                not: {}
                description: Not allowed when 'isPresent' is false or absent
          properties:
            isPresent:
              type: boolean
              description: Whether a broker or dealer was involved in arranging the movement. Absent is equivalent to false.
            items:
              type: array
              minItems: 1
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: Broker or dealer
                description: A single broker or dealer who arranged the transfer. organisationName and contactDetails are required, and exactly one of registrationNumber or reasonForNoRegistrationNumber must be provided. address is optional.
                examples:
                  - organisationName: Broker Demo Ltd
                    registrationNumber: CBDU654321
                    contactDetails:
                      emailAddress: broker@example.com
                      phoneNumber: '01112223333'
                    address:
                      fullAddress: 2 Broker Yard, Test City
                      postcode: TE1 1ST
                  - organisationName: Broker Demo Ltd
                    reasonForNoRegistrationNumber: ONE_OFF
                    contactDetails:
                      emailAddress: broker@example.com
                type: object
                if:
                  properties:
                    registrationNumber: {}
                  required:
                    - registrationNumber
                then:
                  properties:
                    reasonForNoRegistrationNumber:
                      not: {}
                      description: Not allowed when 'registrationNumber' is provided
                else:
                  properties:
                    reasonForNoRegistrationNumber: {}
                  required:
                    - reasonForNoRegistrationNumber
                  description: Required when 'registrationNumber' is not provided
                properties:
                  organisationName:
                    type: string
                    minLength: 1
                    description: Name of the broker or dealer organisation who arranged this transfer.
                  registrationNumber:
                    description: Waste carrier, broker or dealer registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Mutually exclusive with reasonForNoRegistrationNumber — exactly one of the two is required.
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Registration number
                    type: string
                    pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
                  reasonForNoRegistrationNumber:
                    type: string
                    minLength: 1
                    description: Reason no registrationNumber is held. Free text for now — enum values TBC pending BA/policy input. Mutually exclusive with registrationNumber — exactly one of the two is required.
                  contactDetails:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Contact details
                    description: Contact details for a party. At least one of emailAddress or phoneNumber must be provided.
                    examples:
                      - emailAddress: producer@example.com
                        phoneNumber: '01234567890'
                      - emailAddress: producer@example.com
                    type: object
                    properties:
                      emailAddress:
                        type: string
                        format: email
                        description: Contact email address.
                      phoneNumber:
                        type: string
                        pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                        description: Contact phone number, in a valid format.
                    anyOf:
                      - properties:
                          emailAddress: {}
                        required:
                          - emailAddress
                      - properties:
                          phoneNumber: {}
                        required:
                          - phoneNumber
                    additionalProperties: false
                  address:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    title: Address
                    description: A UK or Irish postal address. fullAddress is optional; postcode is required.
                    examples:
                      - fullAddress: 10 Industrial Way, Test City
                        postcode: TE1 2PQ
                    type: object
                    properties:
                      fullAddress:
                        type: string
                        minLength: 1
                        description: Full address line.
                      postcode:
                        type: string
                        pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                        description: Accepts UK postcodes and Irish Eircodes.
                    required:
                      - postcode
                    additionalProperties: false
                required:
                  - organisationName
                  - contactDetails
                additionalProperties: false
              description: The brokers or dealers involved. Required with at least one entry when isPresent is true, and must not be provided otherwise. More than one may be declared.
          additionalProperties: false
        supportingReferences:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Supporting references
          description: label/reference pairs for the movement. Both reference and label are required for every entry.
          examples:
            - - label: PO Number
                reference: PO-123456
              - label: Job Number
                reference: CARRIER-JOB-001
          type: array
          minItems: 1
          items:
            type: object
            properties:
              reference:
                type: string
                minLength: 1
                maxLength: 50
                description: Reference value — must be supplied together with its label.
              label:
                type: string
                enum:
                  - Weighbridge Number
                  - PO Number
                  - Job Number
                  - Invoice Number
                  - Waste Ticket Number
                  - Other
                description: Label identifying the reference type.
            required:
              - reference
              - label
            additionalProperties: false
      required:
        - carrier
        - receiver
        - physicalDetails
        - hazardous
        - treatments
      additionalProperties: false
    recordReceiptWithoutDeliveryRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: Record receipt without delivery request
      description: Payload for POST /beta-2/receipts. A consignmentNote is required when any waste item declares hazardous properties; the service checks that, as the rule spans the waste items and the consignment note.
      type: object
      properties:
        reasonForNoDeliveryId:
          type: string
          minLength: 1
          description: Mandatory explanation for why this receipt is being recorded without a Delivery ID.
          examples:
            - No delivery was recorded prior to receipt; waste received directly from the producer.
        carrier:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Carrier
          description: A single waste carrier. organisationName, meansOfTransport and contactDetails are required, and exactly one of registrationNumber or reasonForNoRegistrationNumber must be provided. vehicleRegistration is required for Road and otherMeansOfTransport for Other; each is forbidden otherwise. address is optional.
          type: object
          allOf:
            - if:
                properties:
                  registrationNumber: {}
                required:
                  - registrationNumber
              then:
                properties:
                  reasonForNoRegistrationNumber:
                    not: {}
                    description: Not allowed when 'registrationNumber' is provided
              else:
                properties:
                  reasonForNoRegistrationNumber: {}
                required:
                  - reasonForNoRegistrationNumber
                description: Required when 'registrationNumber' is not provided
            - if:
                properties:
                  meansOfTransport:
                    const: Road
                required:
                  - meansOfTransport
              then:
                properties:
                  vehicleRegistration: {}
                required:
                  - vehicleRegistration
                description: Required when 'meansOfTransport' is 'Road'
              else:
                properties:
                  vehicleRegistration:
                    not: {}
                    description: Not allowed unless 'meansOfTransport' is 'Road'
            - if:
                properties:
                  meansOfTransport:
                    const: Other
                required:
                  - meansOfTransport
              then:
                properties:
                  otherMeansOfTransport: {}
                required:
                  - otherMeansOfTransport
                description: Required when 'meansOfTransport' is 'Other'
              else:
                properties:
                  otherMeansOfTransport:
                    not: {}
                    description: Not allowed unless 'meansOfTransport' is 'Other'
          properties:
            organisationName:
              type: string
              minLength: 1
              description: Name of the carrier organisation.
            registrationNumber:
              description: Waste carrier registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Mutually exclusive with reasonForNoRegistrationNumber — exactly one of the two is required.
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Registration number
              type: string
              pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
            reasonForNoRegistrationNumber:
              type: string
              enum:
                - ON_SITE
                - HOUSEHOLD
                - ONE_OFF
                - MARINE
              description: Why the carrier has no registration number. Mutually exclusive with registrationNumber — exactly one of the two is required.
            meansOfTransport:
              type: string
              enum:
                - Road
                - Rail
                - Air
                - Sea
                - Inland Waterway
                - Piped
                - Other
              description: How the carrier will transport the waste.
            vehicleRegistration:
              type: string
              minLength: 1
              description: Registration of the vehicle carrying the waste. Required when meansOfTransport is Road; forbidden otherwise.
            otherMeansOfTransport:
              type: string
              minLength: 1
              description: Description of the means of transport. Required when meansOfTransport is Other; forbidden otherwise.
            contactDetails:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Contact details
              description: Contact details for a party. At least one of emailAddress or phoneNumber must be provided.
              examples:
                - emailAddress: producer@example.com
                  phoneNumber: '01234567890'
                - emailAddress: producer@example.com
              type: object
              properties:
                emailAddress:
                  type: string
