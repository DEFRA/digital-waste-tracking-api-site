  /deliveries/{deliveryId}/receipt:
    parameters:
      - name: deliveryId
        in: path
        required: true
        description: Delivery ID returned by `POST /deliveries`.
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: Delivery ID
          description: 'Unique identifier for a delivery, returned by `POST /deliveries`. The server mints a new ID for the non-hazardous Delivery; a hazardous Movement''s Delivery reuses its Movement ID. Format: a two-digit year prefix followed by six or seven characters from A–Z and 0–9, 8 or 9 characters in all. Movement IDs and Delivery IDs share this format. Treat it as opaque: don''t parse it.'
          type: string
          pattern: ^[0-9]{2}[A-Z0-9]{6,7}$
          examples:
            - 25KMT4Z9
        example: 25KMT4Z9
    post:
      tags:
        - Receipt
      summary: Record receipt of waste against a delivery
      description: Records receipt of the waste delivered under the given delivery.
      operationId: recordReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: Record receipt request
              description: Payload for POST /beta-2/deliveries/{deliveryId}/receipt.
              type: object
              properties:
                carrier:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Carrier
                  description: A single waste carrier. organisationName, meansOfTransport and contactDetails are required, and exactly one of registrationNumber or reasonForNoRegistrationNumber must be provided. vehicleRegistration is required for Road and otherMeansOfTransport for Other; each is forbidden otherwise. address is optional.
                  type: object
                  allOf:
                    - if:
                        properties:
                          registrationNumber: {}
                        required:
                          - registrationNumber
                      then:
                        properties:
                          reasonForNoRegistrationNumber:
                            not: {}
                            description: Not allowed when 'registrationNumber' is provided
                      else:
                        properties:
                          reasonForNoRegistrationNumber: {}
                        required:
                          - reasonForNoRegistrationNumber
                        description: Required when 'registrationNumber' is not provided
                    - if:
                        properties:
                          meansOfTransport:
                            const: Road
                        required:
                          - meansOfTransport
                      then:
                        properties:
                          vehicleRegistration: {}
                        required:
                          - vehicleRegistration
                        description: Required when 'meansOfTransport' is 'Road'
                      else:
                        properties:
                          vehicleRegistration:
                            not: {}
                            description: Not allowed unless 'meansOfTransport' is 'Road'
                    - if:
                        properties:
                          meansOfTransport:
                            const: Other
                        required:
                          - meansOfTransport
                      then:
                        properties:
                          otherMeansOfTransport: {}
                        required:
                          - otherMeansOfTransport
                        description: Required when 'meansOfTransport' is 'Other'
                      else:
                        properties:
                          otherMeansOfTransport:
                            not: {}
                            description: Not allowed unless 'meansOfTransport' is 'Other'
                  properties:
                    organisationName:
                      type: string
                      minLength: 1
                      description: Name of the carrier organisation.
                    registrationNumber:
                      description: Waste carrier registration number, in a valid UK home-nation format (England and NRW CBDU/CBDL, SEPA WCR/SCO/SEA/SNO/SWE and PCT, NI ROC UT/LT). Mutually exclusive with reasonForNoRegistrationNumber — exactly one of the two is required.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Registration number
                      type: string
                      pattern: ^\s*(?:[Cc][Bb][Dd][LlUu]\d{3,}|[Ww][Cc][Rr]/[Rr]/\d{7}|(?:[Ss][Cc][Oo]|[Ss][Ee][Aa]|[Ss][Nn][Oo]|[Ss][Ww][Ee]|[Ww][Cc][Rr])/\d{6}|[Pp][Cc][Tt]-[A-Za-z]-\d{3,7}|[Rr][Oo][Cc]\W*[UuLl][Tt]\W*\d{1,5})\s*$
                    reasonForNoRegistrationNumber:
                      type: string
                      enum:
                        - ON_SITE
                        - HOUSEHOLD
                        - ONE_OFF
                        - MARINE
                      description: Why the carrier has no registration number. Mutually exclusive with registrationNumber — exactly one of the two is required.
                    meansOfTransport:
                      type: string
                      enum:
                        - Road
                        - Rail
                        - Air
                        - Sea
                        - Inland Waterway
                        - Piped
                        - Other
                      description: How the carrier will transport the waste.
                    vehicleRegistration:
                      type: string
                      minLength: 1
                      description: Registration of the vehicle carrying the waste. Required when meansOfTransport is Road; forbidden otherwise.
                    otherMeansOfTransport:
                      type: string
                      minLength: 1
                      description: Description of the means of transport. Required when meansOfTransport is Other; forbidden otherwise.
                    contactDetails:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Contact details
                      description: Contact details for a party. At least one of emailAddress or phoneNumber must be provided.
                      examples:
                        - emailAddress: producer@example.com
                          phoneNumber: '01234567890'
                        - emailAddress: producer@example.com
                      type: object
                      properties:
                        emailAddress:
                          type: string
                          format: email
                          description: Contact email address.
                        phoneNumber:
                          type: string
                          pattern: ^\s*(?=(?:\D*\d){7,15}\D*$)\+?[0-9()\-\s]+$
                          description: Contact phone number, in a valid format.
                      anyOf:
                        - properties:
                            emailAddress: {}
                          required:
                            - emailAddress
                        - properties:
                            phoneNumber: {}
                          required:
                            - phoneNumber
                      additionalProperties: false
                    address:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Address
                      description: A UK or Irish postal address. fullAddress is optional; postcode is required.
                      examples:
                        - fullAddress: 10 Industrial Way, Test City
                          postcode: TE1 2PQ
                      type: object
                      properties:
                        fullAddress:
                          type: string
                          minLength: 1
                          description: Full address line.
                        postcode:
                          type: string
                          pattern: ^\s*(?:(?:(([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z]\d{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y]\d{1,2})|(([A-Za-z]\d[A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y]\d?[A-Za-z])))) \d[A-Za-z]{2})))|(?:(?:[Dd]6[Ww]|[AaC-Fc-fHhKkNnPpRrTtV-Yv-y]\d{2}) ?[0-9AaC-Fc-fHhKkNnPpRrTtV-Yv-y]{4}))\s*$
                          description: Accepts UK postcodes and Irish Eircodes.
                      required:
                        - postcode
                      additionalProperties: false
                  required:
                    - organisationName
                    - meansOfTransport
                    - contactDetails
                  additionalProperties: false
                receiver:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: Receiver
                  description: A single intended receiver. siteName, authorisationNumber, receiptAddress and contactDetails are all required.
                  type: object
                  properties:
                    siteName:
                      type: string
                      minLength: 1
                      description: Name of the receiving site.
                    authorisationNumber:
                      description: Receiver environmental permit or exemption number, in a valid UK format.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Authorisation number
                      type: string
                      pattern: ^\s*(?:(?:[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2})|(?:[Ee][Pp][Rr]\/[A-Za-z]{2}\d{4}[A-Za-z]{2}\/[Dd]\d{4,5})|(?:[Ee][Aa][Ww][Mm][Ll]\d{5,6})|(?:[Ww][Mm][Ll]\d{5,6})|(?:[Pp][Pp][Cc]\/[AaWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7})|(?:[Ww][Mm][Ll]\/[LlWwEeNn]\/\d{7}\/\d{2})|(?:[Pp][Pp][Cc]\/[Aa]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ww][Mm][Ll]\/[Ll]\/[Ss][Ee][Pp][Aa]\d{4}-\d{4})|(?:[Ee][Aa][Ss]\/[Pp]\/\d{6})|(?:[Pp]\d{4}\/\d{2}[A-Za-z])|(?:[Pp]\d{4}\/\d{2}[A-Za-z]\/[Vv]\d+)|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2})|(?:[Ww][Pp][Pp][Cc] \d{2}\/\d{2}\/[Vv]\d+)|(?:[Ww][Mm][Ll] \d{2}\/\d+(\/[Tt])? [Ll][Nn]\/\d{2}\/\d+(\/([MmTtCcNn]|[Vv]\d+))*)|(?:[Ww][Mm][Ll] \d{2}\/\d+ [Pp][Aa][Cc]\/\d{4}\/[Ww][Cc][Ll]\d{3}))\s*$
                    receiptAddress:
                      description: Address the waste will be received at. postcode is required; fullAddress is optional.
                      $schema: https://json-schema.org/draft/2020-12/schema
                      title: Address
                      examples:
                        - fullAddress: 10 Industrial Way, Test City
                          postcode: TE1 2PQ
                      type: object
                      properties:
                        fullAddress:
                          type: string
                          minLength: 1
                          description: Full address line.
