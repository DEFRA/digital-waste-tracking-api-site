name: Deploy Release Docs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (commit hash, tag, or branch)'
        required: true
        type: string
      environment:
        description: 'Target environment for documentation'
        required: true
        type: choice
        options:
          - test
          - production
      backend_ref:
        description: 'waste-movement-backend branch, tag or SHA to build the schema explorer from'
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  schema-explorer:
    uses: ./.github/workflows/schema-explorer.yml
    with:
      ref: ${{ github.event.inputs.ref }}
      backend_ref: ${{ github.event.inputs.backend_ref }}

  deploy:
    needs: schema-explorer
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ref exists
        run: |
          REF="${{ github.event.inputs.ref }}"
          if ! git rev-parse "$REF" >/dev/null 2>&1; then
            echo "::error::Ref '$REF' not found"
            exit 1
          fi
          echo "Deploying '${{ github.event.inputs.environment }}' from: $REF ($(git rev-parse $REF))"

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: pip install mkdocs-material mike mkdocs-swagger-ui-tag

      - name: Checkout ref
        run: git checkout ${{ github.event.inputs.ref }}

      # After `Checkout ref`, so the bundle is built from the ref being released.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Bundle OpenAPI specs
        run: npm run specs:bundle

      - name: Add the schema explorer
        if: needs.schema-explorer.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: schema-explorer
          path: docs/schema-explorer

      # A backend change that breaks the explorer fails its job, but doesn't hold
      # up the docs: they go out with the explorer this version already has.
      - name: Keep the published schema explorer
        if: needs.schema-explorer.result != 'success'
        env:
          VERSION: ${{ github.event.inputs.environment }}
        run: |
          echo "::warning title=Schema explorer not updated::Its build failed, so $VERSION keeps the explorer it has."
          git fetch --no-tags origin gh-pages
          # Not there until the explorer has been published once.
          if git cat-file -e "FETCH_HEAD:$VERSION/schema-explorer" 2>/dev/null; then
            git archive FETCH_HEAD "$VERSION/schema-explorer" | tar -x --strip-components=1 -C docs
          fi

      - name: Deploy to ${{ github.event.inputs.environment }}
        run: |
          mike deploy --push --update-aliases ${{ github.event.inputs.environment }}
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            mike set-default --push production
          fi

      - name: Tag commit as ${{ github.event.inputs.environment }}
        run: |
          git tag -f ${{ github.event.inputs.environment }} ${{ github.event.inputs.ref }}
          git push -f origin ${{ github.event.inputs.environment }}

      - name: List deployed versions
        run: |
          git fetch origin gh-pages
          mike list
